openapi: 3.1.0
info:
  title: Unde Labs API
  version: 1.0.0
  description: |
    Predicts the country of origin U.S. Customs (CBP) would likely assign under the
    substantial-transformation test, citing only earlier CBP rulings, and searches
    production plans (operation-group moves) for a target origin. Plans are
    "precedent-supported" at most — never approved or guaranteed.

    Responses built from a case carry `model_ids`, `prompt_versions`, `llm_provider` and the
    `disclaimer`: predict, get case, answers, scenarios, watch, ask, plan (and the plan and
    predict streams' `done` event), plan estimate, compare-targets, export, bom-version, pin
    and batch. Other routes carry less. hts-suggest and parts-hts-suggest carry a singular
    `prompt_version`, `llm_provider` and the `disclaimer`; cost-estimate and family-check
    carry `prompt_version` and `llm_provider`; ruling search and money-prefill carry only the
    `disclaimer`; extract and extract-media return the draft with its `trace`; import and the
    rest (case list, ruling fetch, rename, demos, duty rates, RCEP check, economics, eval summary,
    review links, workspaces, keys, audit) carry none of them; the broker's `GET /v1/review`
    carries the `disclaimer` only. Errors use `{code, message, details}`.

    Calling the hosted API (first server below): paths are under `https://undelabs.dev/api`,
    for example `POST https://undelabs.dev/api/v1/cases/predict`. `/health` is not proxied.
    With an API key, send it as `X-API-Key: op_...`; REST does not accept
    `Authorization: Bearer` (only the MCP endpoint, `https://undelabs.dev/mcp`, maps a bearer
    key to `X-API-Key`). Without a key, the proxy identifies you by the `op_visitor` cookie it
    sets on your first request (HttpOnly, one year) and sends it to the API as `X-Visitor-ID`;
    an `X-Visitor-ID` header sent by a caller is not forwarded. Keep the cookie, or a later
    request cannot see the case you made (404). With curl, use a cookie jar on every call:
    `curl -c jar -b jar -X POST https://undelabs.dev/api/v1/cases/predict -H "Content-Type: application/json" -d '{"date": "2026-06-01", "facts": "..."}'`,
    then `curl -c jar -b jar https://undelabs.dev/api/v1/cases/<case_id>`.

    Security and limits (D137): the full list of auth modes, limits, quotas, spend caps, size
    limits, timeouts, headers and logging is in `docs/api/SECURITY.md`. In short:

    Rate limits (D45, D137): every `/v1` route has a rate class, keyed per client (the
    frontend forwards the browser's address as `X-Client-IP`; an API key has its own
    buckets). Cheap routes with no model call (case reads, rename, delete, economics,
    export, demos, rulings, duty rates, RCEP check, Canada marking check, eval summary, workspaces) 120 a minute; light model
    routes (predict, answers, ask, extract, extract-media, import, money-prefill, hts-suggest,
    parts-hts-suggest, cost-estimate, family-check, scenarios, watch, bom-version) 20 a minute,
    and plan estimate and the audit reads take from the same bucket without a model call; heavy
    ones (plan, compare-targets) 4 a minute, and a batch triage takes the whole heavy bucket;
    plus a global cap. A client may
    have at most 4 model-calling requests running at once (429 `too_many_in_flight`). Over a
    limit: 429 with `Retry-After` and `details.retry_after_s`. Limited responses carry
    `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`. Requests with the admin
    token (`X-Admin-Token` header) are not limited.

    On Cloud Run the model-route limits are counted in one-minute windows shared by every
    instance (D70; the default there since D137, `RATE_LIMIT_STORE`), and `Retry-After` is the
    time until the current window ends; if that store is unavailable the instance falls back
    to its own limits. Locally, and for the cheap class everywhere, each instance counts its own.

    Spend: past the day's model budget new analyses get 503 `budget_reached`; one client
    (API key or address) may spend at most 10% of that budget a day (429
    `client_budget_reached`). Both reset at 00:00 UTC.

    CORS: the API sends no CORS headers. It is for server-to-server calls (`X-API-Key`) and
    for the frontend's own proxy; cross-origin browser calls are not supported.

    Ruling lookups (`GET /v1/rulings/{id}`) have their own per-client limit (30 fetches a minute; a ruling already fetched is free), separate from the model budget (D58).

    Case ownership (D58, `CASE_OWNERSHIP=on`): the frontend proxy sends `X-Visitor-ID` (from an httpOnly cookie). A visitor then sees the pinned demos and their own cases; another visitor's case returns 404 on every endpoint. `GET /v1/cases` returns every pinned case plus the 200 newest others.

    Teams (D68, `TEAMS=on`, off by default; nothing below applies when off): the frontend proxy forwards a signed-in user's Google ID token as `X-User-Token` (an optional `Bearer ` prefix is accepted). The backend verifies it (signature, expiry, issuer, audience `TEAMS_AUDIENCE`, verified email); an invalid or expired token is 401 `unauthenticated` on every endpoint. Without the header the request is anonymous and the D58 rules above apply. A case created by a signed-in user belongs to them and to their workspace (if any). A signed-in user sees the pinned demos, their own cases, their workspace's cases, and the anonymous cases made with the same `X-Visitor-ID`; anyone else gets 404, anonymous visitors included. History events then carry `actor` (the user's email). A user is in at most one workspace. The workspace's initial creator is its first admin; the current role of each member (viewer, editor or admin, see Workspace roles below) is the authority for what they may do, and any admin invites by email; the invitee is not a member (and their cases are not shared) until they accept with `POST /v1/workspaces/{id}/join`.

    Workspace roles (#283, with Teams on): each member of a workspace has a role stored with the workspace and read by the server for every request from a verified signed-in user: `viewer`, `editor` or `admin`. A role is never taken from a header, a body field or a token claim. A member with no stored role is an `editor`; the creator with no stored role is an `admin`; an explicitly stored role overrides both fallbacks. A joiner is an `editor`. On cases that carry the caller's workspace id, a viewer may read cases and lists, call `POST /v1/cases/{id}/plan/estimate` (no write, no model call) and export with `preview: true` (parsed as the JSON boolean true only); every other write, including a recording export, is 403 `forbidden` for a viewer. Only an admin invites, changes roles and removes members. A case a caller cannot see stays 404. The admin token and API keys carry no workspace role and never inherit one. A user removed from a workspace loses access to every case that carries its id, including cases they created; their personal and anonymous-browser cases stay theirs.

    Error codes for 401 and 403 (#283): `unauthenticated` (401) is returned for a missing or invalid `X-User-Token`, and, with `STRICT_AUTH=on`, for a private case operation without a verified identity (identical for missing, hidden and unknown cases). A rejected API key is 401 `unauthorized`, including under strict mode. `forbidden` (403) means the caller can see the case but their workspace role does not allow the action (viewer writes, recording export, non-admin member management), or the admin token is required. Every `/v1/cases*` operation except the admin-only pin lists 401; mutating operations list 403 for the role check (the read-only operations, including `plan/estimate`, do not). Under strict mode a storage failure while loading a case can surface as 500 rather than 401; a case that is not found is always 401 there.

    Admin token and user token together (#283): the admin token keeps its all-access behaviour and never takes a workspace role. If the same request also carries a valid user token, a case it creates is stamped with that user's owner and workspace, as before.

    Operational cost inputs (#281): `economics.operations` is optional everywhere economics are accepted (PUT /v1/cases/{id}/economics, plan, plan SSE, compare-targets, scenarios and predict). Without an active `operations` block every request and response behaves exactly as before. Whose money a plan, compare-targets or scenario request prices is decided by one rule: a request with `annual_import_value_usd` above 0 owns its economics, whole; in operations mode only, an explicitly active `operations` block also owns the request's economics, whole, even at an annual value of 0 (the financial side is then unknown and unpriced, while lead-time and MOQ feasibility are still assessed and can still demote a move, and the body replaces the stored economics instead of merging with them); otherwise the stored economics are used, or empty ones, as before. A client that wants to keep stored money omits `operations` or sends it inactive. Plan, plan stream, compare-targets and scenario saves all follow this rule, so a feasibility-only run is stored whole and returned unpriced. With it, the planner prices a move as modelled yearly duty saved minus the modelled yearly operating cost difference minus one-time costs amortized over `horizon_years`, for the moves searched and the inputs entered; it is not a global optimum. A plan, scenario or target comparison carries an `operations` object. Read `net_priced` before `net_per_year`: when it is false the legacy figure is a ranking aid and the authoritative nullable figures are inside `operations`. `null` means unknown or not modelled and is never a zero; `not_modelled` is present and non-empty even when `priced` is true and must be shown beside any priced figure. A known infeasible move or a fully priced net-costlier move is demoted to `rejected` with `rejection_kind` `operationally_infeasible` or `net_costlier` and a reason; an unknown never demotes and is never labelled feasible. Cost only demotes a plan the legal and precedent gate already showed. A malformed `operations` block is 400 `invalid_input` with a message beginning `economics: operations.<slug>: <path>: <why>` (slugs include `too_large` for a block over 64 KiB, `unknown_field` and `invalid_json`; when the request body also fails the ordinary strict decode the message is `invalid input: economics: operations.<slug>: ...; request body: <decode error>`, and a valid `operations` block never hides an unrelated body error); a body is still read as its first JSON value only, as on every route; there is no new HTTP error code. In operations mode only, a plan or compare-targets run priced from the case's stored economics (the request carried no annual value) is discarded with the existing 409 `conflict` if those economics are edited while it runs; requests without an active `operations` block are not guarded, exactly as before, and a request that carries its own money cannot conflict with itself. `economics_basis` on a plan result is a hash of the raw money inputs; `plan_economics_stale` and `targets_economics_stale` are on every full-case response (get, create, scenarios save, answers, BOM apply, pin) and on the PUT economics response, present and true only when the stored plan or target results were priced from inputs that have since changed: do not present their old money as current, and treat a missing flag as not stale. A client that merges a response over cached case state must clear a cached true when the key is absent. Only the money is stale: the legal result (prediction, verdict, precedent) and the draft letter, which has no money, stay valid and exportable. Editing only `note` or `sources` changes neither the hash nor any result.

    Request reference and log text (#285): the server never echoes a caller-supplied `X-Request-ID`. A supplied value, whatever its length or shape, is replaced in the response by `h_` followed by the first 16 hex characters of its SHA-256; with no value the server generates 16 lowercase hex characters. The response value is the same one used in the server logs and in the audit trail for that request, so quote it to support. It is an unkeyed hash for log hygiene, not anonymisation. No response body shape, error code or status changes. Text only: `GET /health?deep=1` `checks.<name>.error` (on a failed check) is now a fixed phrase (for example `model provider unavailable`, `case store write failed (PermissionDenied)`) and no longer carries the provider body or the store message; new `history[].summary` text for `asked` is `question (<N> characters), <K> what-ifs, cited <ruling numbers>` and for `renamed` is `renamed` (earlier events keep their text and the actor is unchanged); a new `check_failed` rejection from the precedent check has a fixed `rejection_reason` by failure class (earlier reasons are not rewritten).

    Audit trail (#284): a tenant-scoped, append-only audit stream that is separate from the case history. It is off unless an operator configures it: `AUDIT` defaults to `auto`, which turns it on only when `AUDIT_ACTOR_KEY` is set, and `on` without a key fails at startup. When it is off, no event is recorded, the two `/v1/audit*` routes are not registered (404) and sensitive writes are not gated; nothing here says any deployment has it enabled. When it is on, the sensitive writes (case delete, workspace invite, join, role change, member removal or leave, API-key issue and disable) write an intent record first; if that record cannot be written the request is 503 `audit_unavailable` and nothing changes. Other writes proceed even if their intent cannot be recorded. If the completion record cannot be written after a change was made, the change is not rolled back and the response keeps its true status, with the header `X-Audit-Incomplete: completion-not-recorded`; the header can appear on any audited non-streaming route, on a success or an error response (every mutating route, a recording or preview export of a non-pinned case, the audit reads and the API-key list), and not only on the fail-closed operations that can answer 503; a Server-Sent-Events response has already committed its 200 before the work runs, so that header cannot be sent there, and the stream path writes its completion record before the final `done` or `error` event instead. In both cases the trail holds an intent with no completion, which `GET /v1/audit/verify` can report as an unresolved intent only on its final call, as of the verified snapshot, and not as an exact count when its own `complete` is false. Allowed ordinary case reads are not audited: the trail records writes, recording exports, previews of non-pinned cases, authorization denials and audit reads, so it is not a complete record of who read confidential data. Audit writes and the case, workspace or key writes are separate stores and are not atomic with each other. Event times are the server clock in microseconds and never go backwards within a tenant. The hash chain is tamper evidence by the application only: it is not immutable or WORM storage, does not protect against someone with write access to the datastore, and this is audit-readiness support, not SOC 2 certification.

    Strict auth (#283, `STRICT_AUTH=on`, default off, same values as `CASE_OWNERSHIP`; any other value fails startup): private case operations (creating, listing and every route on a non-pinned case) require a verified identity, meaning a validated user token, an API key or the admin token. An `X-Visitor-ID` alone is not authentication and gets 401 `unauthenticated`, identical for missing, hidden and unknown cases. Pinned demos, `/v1/demos*`, `/v1/rulings`, `/v1/eval/summary`, `/v1/duty-rates`, `/v1/rcep/check`, `/health` and the stateless `/v1/products/*` helpers stay open. With it off nothing changes.

    API keys (D69, `API_KEYS=on`, off by default): brokers may call the API with `X-API-Key: op_...` (securityScheme `ApiKey`). Every `/v1` request with a key is checked (unknown or disabled: 401 `unauthorized`) and counted against the key's daily quota (spent: 429 `quota_exceeded`, `Retry-After` at the next UTC day). A key has its own rate-limit buckets, sees the pinned demos and its own cases only, and its cases are hidden from everyone else but the admin, whatever `CASE_OWNERSHIP` says. The admin issues, lists and disables keys under `/v1/admin/api-keys`.

    Broker review links (D200): a case owner makes a link for one draft (`POST /v1/cases/{id}/reviews`), and a customs broker opens it without an account. The broker's two routes, `GET /v1/review` and `POST /v1/review/decision`, take the link token in the `X-Review-Token` header (securityScheme `ReviewToken`), never in a path or query. They have their own rate class (`review`, 30 a minute per client, counted per instance, `RATE_REVIEW_PER_MIN`) and an invalid token counts against a per-client failure budget like an invalid API key (429 `auth_rate_limited`). A revoked or expired link is 410. A token opens one frozen draft snapshot and nothing else.
security:
  - {}
  - ApiKey: []
servers:
  - url: https://undelabs.dev/api
    description: Hosted, through the site's proxy (paths under /api; send X-API-Key, or keep the op_visitor cookie without a key)
  - url: http://localhost:8080
    description: Local (`make run`)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check (not /healthz — Cloud Run reserves paths ending in "z")
      description: With deep=1 it also writes, reads and deletes a probe case with its own random ID (D118) and makes one small model call, and returns 503 when either fails (D47). deep=1 is rate-limited like a light request.
      parameters:
        - { name: deep, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: A dependency check failed (deep=1)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/cases/predict:
    post:
      operationId: predictCase
      summary: Predict origin for a case (creates the case)
      description: |
        With `STREAM_PREDICT=on` on the server (off by default, D71), send `Accept: text/event-stream` to receive the analysis as server-sent events instead of one JSON response:
        - `stage` {name: router|precedents|engine|clarify, status: started|done, ms}: each step as it starts and finishes. `ms` is milliseconds since the request began for `started`, and the step's duration for `done`. The router runs beside precedents and engine; clarify runs only below the fast path. A cached prediction reports `engine` started and done at once, with no `precedents`. On a textile case (D51) `precedents` and `engine` run a second time for the textile engine.
        - `done`: the same body as the 201 JSON response (the case is created and saved), or `error` {code, message, retryable} (no case is saved).
        - `: keep-alive` comment lines every 10 s.
        The stream itself answers 200. Input errors (400), rate limits (429) and the spend cap (503) are returned as normal JSON responses before the stream starts. With the flag off the header is ignored and the response is JSON as before.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PredictRequest" }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "201":
          description: Case created with its prediction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/batch:
    post:
      operationId: triageBatch
      summary: Triage a portfolio (up to 20 products) in one call
      description: |
        Each product is predicted from its facts, triaged and saved as an ordinary case (D47). Japan trade-agreement input is available in JSON rows. One product's failure fills its row's error and does not fail the rest. Send JSON, or multipart/form-data with a "file" (CSV or .xlsx with a header row: name (or product, sku), facts (or description), optional date, optional jurisdiction). Rate-limited as one heavy request per client that takes 20 from the global cap.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [facts]
                    properties:
                      name: { type: string }
                      facts: { type: string }
                      date: { type: string, format: date, description: Default today }
                      jurisdiction: { description: "Optional market (D680); a sheet may have a jurisdiction (or market) column", allOf: [{ $ref: "#/components/schemas/JurisdictionCode" }] }
                      japan: { $ref: "#/components/schemas/JapanInput" }
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: One row per product, in order, and counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Meta"
                  - type: object
                    required: [rows, summary]
                    properties:
                      rows:
                        type: array
                        items:
                          type: object
                          required: [name, out_of_scope, error]
                          properties:
                            name: { type: string, description: The given name, or the first words of the facts }
                            case_id: { type: string }
                            jurisdiction: { $ref: "#/components/schemas/JurisdictionCode" }
                            japan_preference: { $ref: "#/components/schemas/JapanResult" }
                            predicted_origin: { type: string, description: "Absent when the market has no engine (D680)" }
                            confidence: { type: number, description: "The model's stated confidence; read calibrated_confidence first when present (D160, #402)" }
                            calibrated_confidence: { type: number, description: "Calibrated probability when a map applied to this prediction; the triage reason quotes this value" }
                            calibration: { type: string, description: "Calibration map version, e.g. cal-v2; absent when no map applied" }
                            triage_route: { type: string, enum: [auto, needs_review, needs_info] }
                            out_of_scope: { type: boolean }
                            reason: { type: string, description: triage.reason }
                            cost_usd: { type: number }
                            error: { type: [string, "null"], description: null when the product was analysed }
                      summary:
                        type: object
                        properties:
                          total: { type: integer }
                          auto: { type: integer }
                          needs_review: { type: integer }
                          needs_info: { type: integer }
                          out_of_scope: { type: integer, description: Included in needs_review }
                          failed: { type: integer }
                          cost_usd: { type: number }
                          latency_ms: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/cases:
    get:
      operationId: listCases
      summary: List the cases the caller can see, pinned (seeded demos) first, then most recently updated
      description: |
        Scoped before the cap (D119): pinned demos, the caller's own cases and their workspace's cases are read first, then the recent-case cap is applied, so other users' activity cannot push an authorized case out of the list. Health probes are never listed. On Firestore the owner and pinned reads scan the whole collection (legacy documents lack the fields), which costs more reads as the collection grows.
      parameters: [{ $ref: "#/components/parameters/VisitorID" }, { $ref: "#/components/parameters/ClientIP" }]
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: Case summaries
          content:
            application/json:
              schema:
                type: object
                required: [cases]
                properties:
                  cases:
                    type: array
                    items: { $ref: "#/components/schemas/CaseSummary" }
  /v1/cases/{id}:
    get:
      operationId: getCase
      summary: Fetch a case with its prediction and latest plan
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResponse" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: renameCase
      summary: Rename a case (its display name on Cases home)
      description: Sets display_name; product_name stays as entered. Whitespace is collapsed; 1–200 characters. Pinned cases need the admin token (403 otherwise). No model call; recorded in history as renamed; updated_at is unchanged (D48).
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [display_name], properties: { display_name: { type: string, minLength: 1, maxLength: 200 } } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: The updated case row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCase
      summary: Delete a case
      description: Pinned cases (the seeded demos) need the admin token; anyone can delete other cases.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "204": { description: Deleted, headers: { X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/pin:
    put:
      operationId: pinCase
      summary: Pin or unpin a case (admin token required)
      description: Pinned cases list first and cannot be deleted without the admin token. The demo seed pins the cases it creates. Recorded in history; updated_at is unchanged.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pinned], properties: { pinned: { type: boolean } } }
      security: [{ AdminToken: [] }]
      responses:
        "200":
          description: The case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/plan:
    post:
      operationId: planCase
      summary: Search plans for a target origin (needs a structured product and a family)
      description: |
        Send `Accept: text/event-stream` to receive the search as server-sent events instead of one JSON response:
        - `start` {target, moves: [MoveRef], total}: every move to be searched, so each row can be drawn as queued.
        - `baseline` {plan: Plan}: the current setup, any time before `done`.
        - `move_started` {key, done, total}: work began on that move.
        - `move_done` {key, plan: Plan, done, total}: one per move, with economics, shown, rejection_kind and verdict filled in.
        - With FOLLOW_ADVICE=on (D85), after the listed moves: at most one more `move_started` / `move_done` pair for a move
          that was not in `start` (its plan has `from_advice: true`); `total` grows by one from that `move_started` on.
        - `done`: the same body as the 200 JSON response (`plan` is the ranked PlanResult), or `error` {code, message, retryable}.
        - `: keep-alive` comment lines every 10 s.
        - `error` with code `conflict` and `retryable: true` when the case's inputs changed (new BOM or answers) while the search ran: the result was discarded, not saved. D97.
        Input errors (400/404) are returned as normal JSON responses before the stream starts.

        Duplicate searches (JSON responses only, D402): a request whose case and inputs match a search still running on the same
        server instance waits for that search and gets its answer; no second search starts. The search keeps running for 2 minutes
        after its last caller disconnects, so a client that timed out can retry and join it. With an `Idempotency-Key` header, a
        finished search's answer is also returned to a request with the same key for 15 minutes; the same key with different inputs
        is 409 `conflict`. Streamed requests are not joined.
      parameters:
        - { $ref: "#/components/parameters/CaseID" }
        - name: Idempotency-Key
          in: header
          required: false
          description: "Optional, 1 to 200 printable ASCII characters without spaces. Send the same value when retrying the same search (D402)."
          schema: { type: string, maxLength: 200, pattern: "^[!-~]{1,200}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: Plan search result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/plan/estimate:
    post:
      operationId: estimatePlan
      summary: Estimate a plan search's cost and time before running it (no model call)
      description: |
        Takes the same body as `POST /v1/cases/{id}/plan` and makes no model call (D87). It counts the moves the
        search would make and reads the engine and verdict caches: a move already searched costs nothing. For
        the rest it gives a range from measured searches, with the server's settings (precedent panel D83,
        near-miss advice D81, model calls in flight D79). Same ownership rules as the plan route. It uses the
        light rate-limit bucket and is not refused by the daily spend cap, since it spends nothing.
        The range assumes a healthy model provider; under 429/504 a search can take several times longer.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanRequest" }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: Estimate
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id: { type: string }
                  estimate: { $ref: "#/components/schemas/PlanEstimate" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/cases/{id}/export:
    post:
      operationId: exportCase
      summary: Draft a CBP ruling request for the case (Markdown)
      description: >-
        Two formats, both Markdown text. `markdown` (default) is the short generic draft. `cfr177` is a
        letter laid out on 19 C.F.R. § 177.2 (parties, port of entry, transaction, merchandise, materials
        and processing by country, question, position with the earlier rulings, prior consideration,
        documents, confidential treatment, declaration and signature), with `[FILL IN: ...]` wherever the
        case does not know the answer. `cfr177` needs EXPORT_CFR177=on on the server (D66); off, it is a 400.
        409 `conflict` when the case's inputs, or the stored plan the draft was chosen from, changed during the request (nothing is recorded; draft again). D97.
        Preview and the pinned-case rule apply to both: a visitor's export of a pinned demo records nothing (D56).
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: string
                  description: "A plan's plan_id as plan responses return it (the same value as its move key, D470), e.g. motor_fan_assembly@th+pcba@th. Read like move_key; with move_key too, both must name the same plan. Not with plan_index. Omit plan_id, plan_index and move_key to draft for the current setup."
                plan_index:
                  type: integer
                  description: "0-based position in the latest plan search's shown plans: 0 is the first shown plan (D470). Prefer plan_id. Omit plan_id, plan_index and move_key to draft for the current setup."
                target:
                  type: string
                  description: "With plan_id or move_key: draft from that country's search in the latest compare-targets call."
                move_key:
                  type: string
                  description: "Pick a plan by move key (e.g. motor_fan_assembly@th+pcba@th, the plan's plan_id): any shown plan, or a rejected plan with rejection_kind below_confidence_bar. Such a draft says near the top that the precedent check scored under the bar. Other rejected plans return 400. Not with plan_index."
                preview:
                  type: boolean
                  description: "Render the draft without recording it: no exported event in history, exported_at and updated_at unchanged. The Draft screen previews on every visit and records on Download or Print. With workspace roles (#283) a viewer may export only with preview true; without it the export records and a viewer gets 403 forbidden."
                format:
                  type: string
                  enum: [markdown, cfr177]
                  default: markdown
                  description: "markdown: the generic draft. cfr177: the 19 C.F.R. § 177.2 letter with [FILL IN: ...] placeholders; 400 unless the server has EXPORT_CFR177=on (D66)."
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/answers:
    post:
      operationId: answerCase
      summary: Answer follow-up questions; the answers are appended to the facts and the case is re-analysed. Answers are kept on the case as given; for the re-analysis, sentences that only report missing information ("unknown", "not stated") are left out (answers-v2, D26), while a sentence that states a fact together with something unknown is kept whole and verbatim, unknown part included, so the analysis reads the requester's own uncertainty (D115); conditional, hedged or ambiguous mixed sentences are left out whole; 400 if no answer adds a fact
      description: >-
        When the answers change the facts, the case's plan search, target comparison, watch result and exported mark are cleared (they were worked out from the old facts); history and scenarios stay. 409 `conflict` when the case's inputs (for example a new BOM) changed while the re-analysis ran; the answers are not saved, send them again. D97.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  minItems: 1
                  items: { type: object, required: [question, answer], properties: { question: { type: string }, answer: { type: string } } }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The re-analysed case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/reviews:
    post:
      operationId: createBrokerReviewLink
      summary: Make a broker review link for one draft of the case
      description: >-
        D200. Freezes a snapshot of one draft (the current setup, or a plan picked as in `exportCase`) and
        returns a link a customs broker opens without an account. The token is returned once, in `token`
        and `review_path`; only its SHA-256 is stored, so it cannot be shown again (revoke and make a new
        one if it is lost). Expiry is `expires_in_days` (default 14, 1 to 30), enforced by the server.
        At most 5 open links per case (409 `conflict`). Refused (403) on a pinned demo and for a workspace
        viewer. With the audit trail on this is a sensitive write: no intent record, no link (503
        `audit_unavailable`). See docs/api/SECURITY.md.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                plan_id: { type: string, description: "As in exportCase (D470)." }
                plan_index: { type: integer, description: "As in exportCase: 0-based, 0 is the first shown plan. Omit plan_id, plan_index and move_key for the current setup." }
                target: { type: string, description: "With plan_id or move_key: a plan from that country's search in the latest compare-targets call." }
                move_key: { type: string, description: "As in exportCase." }
                format: { type: string, enum: [markdown, cfr177], default: markdown }
                expires_in_days: { type: integer, minimum: 1, maximum: 30, default: 14 }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "201":
          description: The link, shown once, and its record
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          content:
            application/json:
              schema:
                type: object
                required: [review, token, review_path]
                properties:
                  review: { $ref: "#/components/schemas/BrokerReview" }
                  token: { type: string, pattern: "^ubr_[0-9a-f]{12}_[A-Za-z0-9_-]{43}$", description: "The link's secret. Send as X-Review-Token on /v1/review. Not stored; shown only here." }
                  review_path: { type: string, description: "The review page with the token as its URL fragment: /review#{token}. Browsers never send a fragment to a server, so the token reaches no request log or Referer. A token in a path (/review/{token}) is never accepted." }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: listBrokerReviewLinks
      summary: The case's broker review links with their status and the broker's answers
      description: Newest first. Never returns a token, its hash or the draft text. Also on GET /v1/cases/{id} as `broker_reviews` when the case has links. D200.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: The links
          content:
            application/json:
              schema:
                type: object
                required: [case_id, reviews]
                properties:
                  case_id: { type: string }
                  reviews: { type: array, items: { $ref: "#/components/schemas/BrokerReview" } }
        "404": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/reviews/{review}:
    delete:
      operationId: revokeBrokerReviewLink
      summary: Revoke a broker review link
      description: The link answers 410 `link_revoked` from now on. The record and the broker's answers stay on the case. Revoking twice keeps the first time. D200.
      parameters:
        - { $ref: "#/components/parameters/CaseID" }
        - { name: review, in: path, required: true, schema: { type: string, pattern: "^rv_[0-9a-f]{16}$" } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: The revoked link
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review: { $ref: "#/components/schemas/BrokerReview" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { description: "`not_found` (no such case, or hidden) or `review_not_found` (the case has no link with that id)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/review:
    get:
      operationId: getBrokerReview
      summary: The broker's read-only review packet (the link token is the credential)
      description: >-
        D200. Send the link's token in `X-Review-Token`, never in the path or the query. Returns only the
        snapshot frozen when the link was made: no case id, no other link, no owner, no history. The first
        read stamps `first_viewed_at`; every read is an audit `review.view` event in the case's tenant when
        the trail is on. A malformed or unknown token is 404 `not_found` and counts against the client's
        invalid-credential budget (429 `auth_rate_limited` past it); a revoked link is 410 `link_revoked`,
        an expired one 410 `link_expired`. Responses carry `X-Robots-Tag: noindex, nofollow`,
        `Referrer-Policy: no-referrer` and `Cache-Control: no-store`. Rate class `review` (30 a minute per client).
      security: [{ ReviewToken: [] }]
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: The packet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrokerReviewPacket" }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /v1/review/decision:
    post:
      operationId: decideBrokerReview
      summary: "The broker's answer: approve, request changes, or file as a binding ruling request"
      description: >-
        D200. Token in `X-Review-Token`. Changes only this link's record on the case, never the case's
        analysis. `comment` is plain text (control characters other than newline and tab are dropped,
        at most 2000 characters) and is required for `changes`; clients must render it as text. A link
        takes at most 20 answers (409 `conflict`). Errors as getBrokerReview, plus 400 `invalid_input`.
      security: [{ ReviewToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, changes, file_request] }
                comment: { type: string, maxLength: 2000 }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "200":
          description: The link after the answer
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          content:
            application/json:
              schema:
                type: object
                required: [review]
                properties:
                  review: { $ref: "#/components/schemas/BrokerReviewForBroker" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /v1/products/import:
    post:
      operationId: importProduct
      summary: Turn a bill of materials (CSV or Excel) into a structured product
      description: |
        Does not create a case: send the returned product (with the family) to POST /v1/cases/predict.
        One row per component, or per operation with type "operation". Headers (case-insensitive, aliases accepted):
        name (component / part / item), country (made in / origin), plant (factory / site / supplier; defaults to the country),
        group (operation group, matched to the family template by id or name), type (component, operation, or plant: a plant that makes nothing today, named in the name column, with its plant_capabilities), plant_capabilities (groups the row's plant could also perform, ";"-separated).
        Up to 500 rows, 5 MB. Samples: backend/testdata/heatgun_bom.csv, backend/testdata/lidar_bom.csv.
        Optional money columns (#235) prefill the economics: unit_cost_usd (per finished unit, per row), qty (default 1),
        annual_units and unit_price_usd (first non-empty cell), hts (first non-empty cell; sets product.hts). A group's yearly
        cost at a plant is the sum of unit cost × qty × annual units; the import value is annual units × unit price.
        Each cost is keyed by the plant ID the product parser resolves for that row (the explicit plant, else the canonical country such as
        PRC to china, D105), never by the raw country cell; a row naming a plant that is not in the sheet is skipped with a warning.
        Product name and family (18 Oct): the given name and family win; then the sheet's product / product name and family /
        product family columns (a family by its id or name); then, with the family checker, a sure match (confidence >= 0.6) on
        the parts and its suggested product name. Leave family empty to let the file or the check choose it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: CSV or .xlsx (first sheet) }
                name: { type: string }
                description: { type: string }
                family: { type: string, description: "needed for groups and the plan search, e.g. motorised_tools_small_appliances" }
                fallback_name: { type: string, description: "Names the product when the request, the sheet and the family check give no name (e.g. the file's name)" }
                name_hint: { type: string, description: "A product name read from the file's name; used after the sheet's column and before the family check's name (name_source file_name)" }
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
                name: { type: string }
                description: { type: string }
                family: { type: string }
                fallback_name: { type: string }
                name_hint: { type: string }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: The product, plus warnings about what the plan search will lack (no groups, one plant, no extra capabilities, unknown groups)
          content:
            application/json:
              schema:
                type: object
                required: [product, family, warnings]
                properties:
                  product: { $ref: "#/components/schemas/Product" }
                  family: { type: string }
                  warnings: { type: array, items: { type: string } }
                  economics: { description: "Only when the sheet has money columns: the prefilled money inputs (illustrative)", allOf: [{ $ref: "#/components/schemas/Economics" }] }
                  economics_sources: { type: object, additionalProperties: { type: string, enum: [file] }, description: "Which fields came from the file: hts, annual_import_value_usd, group_costs" }
                  name_source: { type: string, enum: [file, file_name, ai], description: "Where the product name came from when the request gave none" }
                  family_source: { type: string, enum: [given, file, ai] }
                  family_reason: { type: string, description: "The family check's reason, when family_source is ai" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/products/money-prefill:
    post:
      operationId: prefillMoney
      summary: Fill the duty rates of the money inputs from the product's HTS number, or a suggested one (#235)
      description: |
        Nothing is saved. HTS: the product's own, else (HTS_SUGGEST=on) the top suggestion from CBP rulings (one router-model call),
        labelled "suggested". Duty: for every country in the product's plants and components, the sourced table rate (D52) or the
        live MFN rate plus Section 301 (D65, D90), as a plan search would price it. The user's own rates always win.
        Rate-limited as light.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product: { $ref: "#/components/schemas/Product" }
                economics: { $ref: "#/components/schemas/Economics" }
      responses:
        "200":
          description: The economics with duty rates filled, and where each rate came from
          content:
            application/json:
              schema:
                type: object
                required: [economics, duty_sources, disclaimer]
                properties:
                  economics: { $ref: "#/components/schemas/Economics" }
                  duty_sources: { type: object, additionalProperties: { type: string, enum: [table, live, given] }, description: "Per country: table (sourced, D52), live (HTS MFN + Section 301), given (the user's)" }
                  hts: { type: string, description: "The HTS number used; absent when there is none" }
                  hts_source: { type: string, enum: [product, suggested] }
                  hts_suggestion: { type: object, description: "The suggestion used, when hts_source is suggested (as in /v1/products/hts-suggest)" }
                  hts_note: { type: string, example: "suggestion only — confirm the classification with a licensed broker", description: "Also set when the product's HTS is given but is not a valid 8- or 10-digit number: nothing is looked up or filled (D108)" }
                  disclaimer: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/products/family-check:
    post:
      operationId: checkFamily
      summary: Match what the user typed as a product family to a supported template family, or "none" (18 Oct)
      description: |
        One router-model call with a constrained answer: the family must be a template that exists, or "none". "none" means origin
        prediction works but the plan search has no template for the product. The product's name and part names, when given, are read
        with the text. Nothing is saved. Rate-limited as light. Always registered in production; absent (404) when no checker is wired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, example: "hair dryer" }
                product: { $ref: "#/components/schemas/Product" }
      responses:
        "200":
          description: The match
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: object
                    required: [family, confidence, reason]
                    properties:
                      family: { type: string, description: "A template family (e.g. motorised_tools_small_appliances) or none" }
                      name: { type: string, description: "The family's display name; absent for none" }
                      confidence: { type: number }
                      reason: { type: string }
                      product_name: { type: string, description: "A short name for the product, e.g. Hair dryer" }
                      typed_unclear: { type: boolean, description: "The typed text alone names no product type (e.g. random letters); a family here comes from the product's parts" }
                  prompt_version: { type: string, example: family-check-v1 }
                  llm_provider: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/products/cost-estimate:
    post:
      operationId: estimateCost
      summary: AI estimates for the yearly group costs the user left blank (#235 step 4)
      description: |
        One router-model call. Only blank cells are estimated: each group the product has, at each plant that makes it or lists it
        as a capability (final assembly is left out). The user's costs are anchors and never change. Each estimate has a range
        and a one-line reason. Needs an anchor: annual_import_value_usd or at least one group cost (400 otherwise). Nothing is
        saved; estimates are illustrative. Rate-limited as light.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product: { $ref: "#/components/schemas/Product" }
                economics: { $ref: "#/components/schemas/Economics" }
      responses:
        "200":
          description: The estimates
          content:
            application/json:
              schema:
                type: object
                required: [estimates, note, illustrative]
                properties:
                  estimates:
                    type: array
                    items:
                      type: object
                      required: [group, plant, low, usd, high, reason]
                      properties:
                        group: { type: string }
                        plant: { type: string }
                        low: { type: number }
                        usd: { type: number }
                        high: { type: number }
                        reason: { type: string }
                  note: { type: string }
                  illustrative: { type: boolean }
                  prompt_version: { type: string, example: cost-estimate-v1 }
                  llm_provider: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/products/extract:
    post:
      operationId: extractProduct
      summary: Draft an editable structured product from pasted facts text (nothing is saved)
      description: |
        The engine model lists the parts, countries and assembly steps the text states, paragraph by paragraph (paragraphs split on blank lines, cited 1-based). Code then checks groups against the family template, names unnamed plants "<Country> plant" (name_guessed), and asks what else each plant could make (the plan search needs capabilities).
        Parts mentioned without a stated country are not guessed: they are listed in one warning. Send the edited product with the facts to POST /v1/cases/predict. ~15 s through the proxy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facts]
              properties:
                facts: { type: string, maxLength: 12000 }
                family: { type: string, description: "needed for groups and capability questions" }
                name: { type: string, description: "product name; defaults to the name in the text" }
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: "#/components/schemas/Product" }
                  plants: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, country: { type: string }, capabilities: { type: array, items: { type: string } }, name_guessed: { type: boolean } } } }
                  components: { type: array, items: { $ref: "#/components/schemas/DraftRow" } }
                  operations: { type: array, items: { $ref: "#/components/schemas/DraftRow" } }
                  warnings: { type: array, items: { type: string } }
                  questions: { type: array, items: { type: object, properties: { plant_id: { type: string }, ask: { type: string }, options: { type: array, items: { type: string } } } } }
                  paragraphs: { type: integer }
                  trace: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/products/extract-media:
    post:
      operationId: extractProductFromMedia
      summary: Draft an editable structured product from images or scanned PDFs (nothing is saved, nothing is predicted)
      description: |
        "Import from an image or scanned document". Upload a photo or screenshot of a bill of materials, a scanned BOM or spec-sheet PDF, or a product photo with its spec sheet. The engine model (Gemini, multimodal; ENGINE_MODEL) reads the files once and returns the same draft as POST /v1/products/extract, with rows citing the file and page they were read from instead of a paragraph. Parts printed without a country are listed in one warning, never guessed. Rows the model was not sure it read are marked `unclear`; places it could not read are listed in `unreadable` and in `warnings`.
        The draft is for review: show it to a person, let them edit it, then send the product to POST /v1/cases/predict. Never predict from it unreviewed.
        A separate endpoint from /v1/products/extract (JSON text) so each has one content type, one size limit and one schema.
        Limits: 1 to 4 files, 8 MB together; images up to 12,000 pixels a side and 40 megapixels; PDFs up to 10 pages together; encrypted PDFs are refused. The type is sniffed from the bytes (the file name and declared Content-Type are ignored). Files are read into memory, sent to the model and dropped: they are not stored, cached or logged, and the response describes them by type, size and pages only.
        With LLM_PROVIDER=fake the answer is a fixed example with `simulated: true` and a first warning saying so. Rate-limited as light. Through the web proxy the body limit is 9 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items: { type: string, format: binary }
                  description: "repeat the field for each file: image/png, image/jpeg, image/webp or application/pdf"
                family: { type: string, description: "needed for groups and capability questions" }
                name: { type: string, maxLength: 512, description: "product name; defaults to the name printed in the files" }
      responses:
        "200":
          description: The draft, to review and edit before predicting
          content:
            application/json:
              schema:
                type: object
                required: [product, components, operations, warnings, source, files, unreadable]
                properties:
                  product: { $ref: "#/components/schemas/Product" }
                  plants: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, country: { type: string }, capabilities: { type: array, items: { type: string } }, name_guessed: { type: boolean } } } }
                  components: { type: array, items: { $ref: "#/components/schemas/DraftRow" } }
                  operations: { type: array, items: { $ref: "#/components/schemas/DraftRow" } }
                  warnings: { type: array, items: { type: string }, description: "what to check, in plain words; includes every unreadable place and unclear row" }
                  questions: { type: array, items: { type: object, properties: { plant_id: { type: string }, ask: { type: string }, options: { type: array, items: { type: string } } } } }
                  paragraphs: { type: integer, description: "always 0 for media" }
                  source: { type: string, enum: [media] }
                  files: { type: array, items: { $ref: "#/components/schemas/MediaFile" } }
                  unreadable:
                    type: array
                    items:
                      type: object
                      properties:
                        file: { type: integer, description: "1-based file position" }
                        page: { type: integer, description: "1-based page; 0 if the model cited a page that does not exist" }
                        what: { type: string, description: "what could not be read, e.g. \"row 7, the country is cut off\"" }
                  simulated: { type: boolean, description: "true when the local fake model answered: the files were not read and the rows are a fixed example" }
                  trace: { type: object, description: "provider, model_id, prompt_version (extract-image-v1), tokens, latency" }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/products/hts-suggest:
    post:
      operationId: suggestHts
      summary: Suggest up to 3 HTS subheadings from CBP rulings that state one (off unless HTS_SUGGEST=on, D64)
      description: |
        BM25 finds the 10 indexed rulings most like the product (815 rulings whose text states the subheading CBP applied, 449 distinct 8-digit subheadings; `backend/data/hts_index.json`), groups them by subheading and keeps the 3 best (summed scores). One router-model call (constrained JSON) gives each a short reason, citing only rulings retrieved for that subheading. If that call fails the candidates are still returned with `reasons_unavailable: true`.
        A suggestion, not a classification: every response carries the note "suggestion only — confirm the classification with a licensed broker". Rate-limited as light. 404 when HTS_SUGGEST is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`facts` (pasted text) or a structured `product`; facts win when both are given"
              properties:
                facts: { type: string, maxLength: 12000 }
                product: { $ref: "#/components/schemas/Product" }
      responses:
        "200":
          description: Candidates, best first (empty when no indexed ruling shares a term with the product)
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      properties:
                        hts: { type: string, example: "8419.89.95", description: "8-digit subheading" }
                        supporting_rulings:
                          type: array
                          items: { type: object, properties: { id: { type: string }, date: { type: string, format: date }, subject: { type: string }, url: { type: string } } }
                        reason: { type: string, description: "empty when reasons_unavailable" }
                        cited: { type: array, items: { type: string }, description: "supporting rulings the reason relies on" }
                        duty_rates_available: { type: boolean, description: "GET /v1/duty-rates?hts= has sourced rates for it" }
                  note: { type: string, example: "suggestion only — confirm the classification with a licensed broker" }
                  reasons_unavailable: { type: boolean }
                  trace: { type: object, nullable: true }
                  llm_provider: { type: string }
                  prompt_version: { type: string, example: hts-suggest-v2 }
                  source: { type: string, enum: [cross, index], description: "cross: candidates from a live CBP rulings search mixed with the local index; index: the local index only (CBP's search was unreachable). D92" }
                  disclaimer: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/products/parts-hts-suggest:
    post:
      operationId: suggestPartsHts
      summary: Suggest up to 3 HTS codes for each part of a product, for the 19 CFR 102.20 rule check (on unless PARTS_HTS_SUGGEST=off, D380)
      description: |
        For each named part (at most 20), BM25 over the part index (`backend/data/part_hts_index.json`: sentences of CBP rulings that classify a named part, such as "The aluminum pegs will be classified in subheading 8302.50") gives up to 4 codes CBP stated for similar parts. One router-model call for the whole product ranks them and, when no ruling fits, may give its own code. Each candidate says where it comes from: `rulings` (an earlier ruling states this code for a similar part; `supporting_rulings` lists them, `cited` the ones the reason relies on) or `model` (the model's own reading of the HTSUS, no supporting ruling). A model code of 8 digits is kept only when it is in today's HTS. When the product has no `hts`, the good's code is suggested in the same call (`good`; candidates from the same search as /v1/products/hts-suggest). Answers per part are cached for a day by the part's and the product's name.
        Nothing is stored or filled in. Accepting a code is the client's step: put it on the part (`components[].hts`) and the rule check runs when the case is read (D363). Every response carries the note "unverified suggestions — check every code with your customs broker before you rely on it". If the model call fails, the ruling candidates come back without reasons (`reasons_unavailable: true`). Rate-limited as light; counts toward the daily spend cap and the client's share of it. 404 when PARTS_HTS_SUGGEST=off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product]
              properties:
                product: { $ref: "#/components/schemas/Product" }
      responses:
        "200":
          description: Codes per part, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer, description: "position of the part in product.components" }
                        name: { type: string }
                        cached: { type: boolean, description: "answered from the one-day cache, no model call" }
                        candidates: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PartHtsCandidate" } }
                  good:
                    type: object
                    nullable: true
                    description: "null when the product already has an hts"
                    properties:
                      candidates: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PartHtsCandidate" } }
                      source: { type: string, enum: [cross, index] }
                  note: { type: string, example: "unverified suggestions — check every code with your customs broker before you rely on it" }
                  reasons_unavailable: { type: boolean }
                  flagged: { type: integer, description: "How many part candidates carry a check note (D471)" }
                  trace: { type: object, nullable: true }
                  llm_provider: { type: string }
                  prompt_version: { type: string, example: parts-hts-suggest-v1 }
                  max_parts: { type: integer, example: 20 }
                  disclaimer: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/compare-targets:
    post:
      operationId: compareTargets
      summary: Compare 2–4 target countries (one plan search each, in parallel) and rank them
      description: |
        Ranking: countries with a shown plan first (by their best plan's tier, clear margin before at the bar, then net per year; D371), then countries whose best precedent-supported plan is below the bar, then no supported plan, then no capable plant.
        Moves only go to plants the product lists in that country, so give the product plants (with capabilities) in each country to compare. Economics: given here, or the case's latest. Invalid economics is 400 before pricing (D106).
        Draft a plan from a target with POST /export {"plan_id", "target"} (the best plan's plan_id; move_key is the same value). Takes about as long as one plan search (~30 s).
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: { type: array, minItems: 2, maxItems: 4, items: { type: string }, example: [Thailand, Vietnam, Malaysia] }
                jurisdiction: { description: "Optional; as in PlanRequest", allOf: [{ $ref: "#/components/schemas/JurisdictionCode" }] }
                economics: { $ref: "#/components/schemas/Economics" }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: Ranked countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id: { type: string }
                  jurisdiction: { $ref: "#/components/schemas/JurisdictionCode" }
                  targets: { type: array, items: { $ref: "#/components/schemas/TargetSummary" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/economics:
    put:
      operationId: putEconomics
      summary: Replace the case's money inputs (no model calls)
      description: Plan, scenarios and compare-targets use the case's economics when their own request omits economics. Duty rates are fractions (0.25 = 25%); values must not be negative. Returns the stored economics. The same validation (rates 0 to 1, no negative annual value, group cost or target cost, no non-finite number) runs on the effective economics of plan, plan/estimate, scenarios and compare-targets, supplied or reused, before any pricing, planner or model call; an invalid value is 400 `invalid_input` and nothing is saved (D106).
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Economics" }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id: { type: string }
                  economics: { $ref: "#/components/schemas/Economics" }
                  plan_economics_stale: { type: boolean, enum: [true], description: "Present, and true, only when the stored plan was priced from economics that have since changed; a missing flag means not stale (clear any earlier true)" }
                  targets_economics_stale: { type: boolean, enum: [true], description: "Present, and true, only when a stored target comparison was priced from economics that have since changed; a missing flag means not stale (clear any earlier true)" }
                  scenarios:
                    type: array
                    description: The case's saved scenarios priced with the money just saved (same shape as the case's scenarios, D131); absent when the case has none. A comparison that cannot be priced (no annual import value, or a missing duty rate or cost) is null, never zero.
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        facts: { type: string }
                        product: { $ref: "#/components/schemas/Product" }
                        prediction: { $ref: "#/components/schemas/Prediction" }
                        triage: { $ref: "#/components/schemas/Triage" }
                        precedents_detail: { type: array, items: { $ref: "#/components/schemas/PrecedentRef" } }
                        comparison: { $ref: "#/components/schemas/Comparison" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/ask:
    post:
      operationId: askCase
      summary: Ask the case agent a question about this case
      description: |
        An ADK agent with tools get_case (the first 6000 characters of the facts, with a notice when more exist), get_case_facts (the facts by character offset, at most 4000 per call), search_rulings / read_ruling (rulings dated before the case) and what_if (re-runs the engine on the full revised facts, at most 12,000 characters, at most 2 per question; longer facts are refused with a message and nothing is predicted) (D116).
        The conversation is kept on the case (last 20 turns; the last 6 are given as context). {"reset": true} clears it. Typical latency 15–40 s through the proxy.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string, maxLength: 2000 }
                reset: { type: boolean }
                history:
                  type: array
                  maxItems: 6
                  description: |
                    Pinned demos only (D120): the visitor's own completed turns this visit. The demo is never written, so the server cannot remember them. Ignored on every other case, where the saved chat is the only source. More than 6 turns, an empty question or answer, a question over 2000 characters or an answer over 4000 is a 400. The agent sees the seeded demo chat followed by these turns, cut to the last 6, and the answer memo covers exactly that history. A client replaces an entire answer longer than 4000 characters with a short omission marker before sending it.
                  items:
                    type: object
                    required: [question, answer]
                    properties:
                      question: { type: string, minLength: 1, maxLength: 2000 }
                      answer: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The reply and the conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id: { type: string }
                  reply:
                    type: object
                    properties:
                      answer: { type: string }
                      cited_rulings: { type: array, items: { type: string }, description: "ruling numbers in the answer that the agent saw in a tool result or the case" }
                      dropped_rulings: { type: array, items: { type: string }, description: "ruling numbers in the answer it never saw (do not show as citations)" }
                      what_ifs: { type: array, items: { $ref: "#/components/schemas/WhatIf" } }
                      steps: { type: array, items: { $ref: "#/components/schemas/ChatStep" } }
                      model_calls: { type: integer }
                      trace: { type: object }
                  cited_detail: { type: array, items: { $ref: "#/components/schemas/PrecedentRef" } }
                  chat: { type: array, items: { $ref: "#/components/schemas/ChatTurn" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/scenarios:
    post:
      operationId: runScenarios
      summary: Predict 1–3 alternative production setups side by side (replaces the case's previous scenarios)
      description: Each scenario gives facts text or a structured product (rendered with the case family's template). Scenarios run the engine, router and triage like predict, without the clarify review. The case's own prediction is unchanged.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarios]
              properties:
                scenarios:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    description: exactly one of facts or product
                    properties:
                      label: { type: string, description: "defaults to 'Scenario N'" }
                      facts: { type: string, description: "Free text, trimmed and stored with one terminal newline; at most 12,000 characters, not counting that newline (400 beyond) (D116)" }
                      product: { $ref: "#/components/schemas/Product" }
                economics:
                  description: Prices each scenario against the current setup (comparison). When omitted, the case's latest economics from a plan search or scenarios call are used.
                  allOf: [{ $ref: "#/components/schemas/Economics" }]
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The case with scenarios filled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/bom-version:
    post:
      operationId: applyBomVersion
      summary: Compare a newer bill of materials with the case's product (supplier change alert; off unless BOM_VERSIONS=on)
      description: |
        D67. Served only with `BOM_VERSIONS=on` (otherwise 404). The upload is read as for POST /v1/products/import (CSV or .xlsx, 5 MB, 500 rows; Excel limits from D57) and parsed with the case's family template; the product name, description and HTS stay the case's, and plants that are the same supplier (same normalized name, D105) keep the case's plant IDs.
        The new product is compared with the case's: components added or removed, a component made in another country or at another plant, operations added, removed or moved to another plant. Groups and capabilities are not compared (they change the plan search, not the origin).
        When anything changed, the new product is rendered with the family template and predicted like a scenario (router, engine, triage; one engine call). If the case's facts are not the rendered old product (CBP's wording, a drafted description, clarify answers), the old product is rendered and predicted too (a second engine call) so origin_changed compares two BOMs, not two wordings (facts_basis: rendered). With no change, nothing is predicted or saved (applied is false, even with apply) and the case's own origin is returned.
        Without `apply` nothing is saved. With `apply: true` the case takes the new product, rendered facts and prediction (with the clarify review, as predict), records a `bom_updated` history event, and drops what was worked out from the old product or facts (plan, target comparison, watch, draft, clarify answers, and current_origin: CBP's ruling was on the old BOM); scenarios stay. Pinned demo cases refuse `apply` without the admin token (403, D57); another visitor's case is a 404 with ownership on (D58). Rate-limited as light.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: CSV or .xlsx (first sheet) }
                apply: { type: string, enum: ["true", "false"], description: "default false" }
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
                apply: { type: boolean, default: false }
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "200":
          description: The changes and the comparison of origins
          content:
            application/json:
              schema:
                type: object
                required: [case_id, changes, warnings, product, old_origin, new_origin, new_confidence, origin_changed, triage, repredicted, applied, facts_basis, case_origin]
                properties:
                  case_id: { type: string }
                  changes:
                    type: array
                    items:
                      type: object
                      required: [kind, name, summary]
                      properties:
                        kind: { type: string, enum: [component_added, component_removed, country_changed, plant_changed, operation_added, operation_removed, operation_moved] }
                        name: { type: string, description: Component or operation name }
                        from_country: { type: string }
                        to_country: { type: string }
                        from_plant: { type: string, description: Plant name }
                        to_plant: { type: string, description: Plant name }
                        summary: { type: string, example: "electric motor: made in Thailand, was China (plant Rayong plant, was China suppliers)" }
                  warnings: { type: array, items: { type: string }, description: What the plan search will lack, as for import }
                  product: { $ref: "#/components/schemas/Product" }
                  old_origin: { type: string, description: "The origin for the old BOM: the case's prediction when facts_basis is case, the old product rendered and predicted when it is rendered" }
                  old_confidence: { type: number, description: "The model's stated confidence for the old BOM; read old_calibrated_confidence first when present (D160, #402)" }
                  old_calibrated_confidence: { type: number, description: "Calibrated probability for the old BOM when a map applied" }
                  facts_basis:
                    type: string
                    enum: [case, rendered]
                    description: "case: the case's facts are the rendered product, so its prediction is the before. rendered: the case was predicted from other wording (CBP's facts, a drafted description, clarify answers), which alone can move the origin (D16), so the old product was rendered and predicted too (one more engine call) and origin_changed compares rendered old with rendered new."
                  case_origin: { type: string, description: "The case's own predicted origin (equals old_origin when facts_basis is case)" }
                  new_origin: { type: string, description: Predicted origin for the new BOM (old_origin when nothing changed) }
                  new_confidence: { type: number, description: "The model's stated confidence for the new BOM; read new_calibrated_confidence first when present (D160, #402)" }
                  new_calibrated_confidence: { type: number, description: "Calibrated probability for the new BOM when a map applied" }
                  calibration: { type: string, description: "Calibration map version for the calibrated values, e.g. cal-v2; absent when no map applied" }
                  origin_changed: { type: boolean, description: new_origin differs from old_origin (both from the same kind of facts) }
                  triage: { $ref: "#/components/schemas/Triage" }
                  prediction: { description: "The new prediction; absent when nothing changed", allOf: [{ $ref: "#/components/schemas/Prediction" }] }
                  repredicted: { type: boolean, description: false when no change could affect the origin (no model call) }
                  applied: { type: boolean }
                  case: { description: "The updated case, when applied", allOf: [{ $ref: "#/components/schemas/CaseResponse" }] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/cases/{id}/watch:
    post:
      operationId: watchCase
      summary: Re-check the prediction with every precedent available today
      description: >-
        The original prediction only saw rulings dated before the case date. This re-runs the engine with precedents dated before today and records the result in watch; the case's own prediction and updated_at are unchanged. status is changed when the origin differs. 409 `conflict` when the case's inputs (a new BOM or answers) changed during the re-check: the result is discarded, not saved (D97). In the scheduler run such a case is listed in `failed`.
      parameters: [{ $ref: "#/components/parameters/CaseID" }]
      responses:
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: The case with watch filled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaseResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/Error" }
  /v1/watch/run:
    post:
      operationId: runWatch
      summary: Re-check every analysed case (for a scheduler; admin token required)
      description: |
        Re-runs every analysed case with today's precedents (model calls, within the spend caps) and lists the cases whose origin changed. It also lists revocation alerts (D480): cases whose cited, plan-supporting or current-setup rulings CBP has revoked, modified or proposed to change, read from the stored cases and the committed supersession map. With `alerts_only=true` it returns the alerts only and re-runs nothing (no model call). Stored answers are never changed.
      security: [{ AdminToken: [] }]
      parameters:
        - { name: alerts_only, in: query, required: false, schema: { type: string, enum: ["true"] }, description: "List revocation alerts without re-running any case (checked is 0)." }
      responses:
        "403": { $ref: "#/components/responses/Error" }
        "200":
          description: Counts and the cases whose origin changed
          content:
            application/json:
              schema:
                type: object
                required: [checked, changed, failed]
                properties:
                  checked: { type: integer }
                  changed: { type: array, items: { type: string } }
                  changed_basis: { type: object, description: "Case id -> Watch.basis for each changed case; only basis precedent is a ruling change. Every changed case carries a basis in this run, so a case missing here is not a ruling change", additionalProperties: { type: string, enum: [precedent, regime, method, specialist_unavailable, unverified] } }
                  failed: { type: array, items: { type: string } }
                  ruling_alerts:
                    type: object
                    description: "Case id -> revocation alert counts (D480), for analysed cases with at least one final or proposed change to a ruling they rely on. rulings lists the final ones in words."
                    additionalProperties:
                      type: object
                      properties:
                        final: { type: integer }
                        proposed: { type: integer }
                        rulings: { type: array, items: { type: string } }
  /v1/rulings:
    get:
      operationId: searchRulings
      summary: Search the precedent corpus of earlier CBP rulings by text (no model call)
      description: |
        Keyword (BM25) ranking over the facts sections of the rulings Unde predicts from; rulings that share no query word are not returned. Served when the server has the corpus index (always in the deployed server). No model call and no fetch from CBP: it takes from the per-client ruling-lookup limit only (429 when spent). The query is not echoed or logged. Read a ruling in full with `GET /v1/rulings/{id}`. Also the MCP tool `search_rulings` (docs/MCP.md).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 300 }, description: "Search words; at least one word of 3 or more letters." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
        - { name: before, in: query, required: false, schema: { type: string, format: date }, description: "Only rulings dated strictly before this date." }
      responses:
        "200":
          description: Matching rulings, best first
          content:
            application/json:
              schema:
                type: object
                required: [rulings, disclaimer]
                properties:
                  rulings:
                    type: array
                    items:
                      type: object
                      required: [id, date, origin, url, snippet, score]
                      properties:
                        id: { type: string, example: N300001 }
                        date: { type: string, format: date }
                        subject: { type: string }
                        origin: { type: [string, "null"], description: "CBP's held origin; null when the ruling has no single held origin" }
                        url: { type: string }
                        snippet: { type: string, description: "The first 300 characters of the ruling's facts section" }
                        score: { type: number }
                        superseded: { $ref: "#/components/schemas/Superseded" }
                        proposed: { $ref: "#/components/schemas/ProposedChange" }
                  disclaimer: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/rulings/{id}:
    get:
      operationId: getRuling
      summary: A CBP ruling's text (proxied from rulings.cbp.gov) with its public link
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[NH][0-9]{6}$", example: N357771 }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Ruling
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ruling" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/duty-rates:
    get:
      operationId: getDutyRates
      summary: Sourced duty rates by HTS subheading, with every component and source (D52)
      description: >-
        The sourced table always wins. With DUTY_LIVE_MFN=on (default off), a subheading the table does not have is
        answered with its live MFN (column 1 general) rate from the USITC HTS as `{hts, description, live_mfn}` (D65).
        A live fetch (not a cached answer) counts against the per-client lookup limit (429). A missing line or a
        failed fetch is 404, never 5xx.
        `hts` is checked first (D108): 8 digits, or 10 with a statistical suffix, with one consistent separator (dot, space
        or dash). Letters, other lengths and mixed separators are 400 `invalid_input` with a short fixed message that does
        not echo the input. A query string that cannot be parsed at all (for example a raw `;` or a bad %-escape, even in
        another key) is refused whole with 400. A present but empty `hts` is 400; only an absent `hts` lists every line.
        With duplicate `hts` parameters the first one wins. A malformed number makes no lookup and no network call.
      parameters:
        - { name: hts, in: query, required: false, schema: { type: string, example: "8419.89.95" }, description: "8 digits, or 10 with a statistical suffix; dots, spaces or dashes (one kind) allowed; omit to list every line. Present but empty or malformed is 400 (D108)." }
      responses:
        "200":
          description: One line (with hts) or {lines} (without), or a live MFN rate (D65)
          content:
            application/json:
              schema:
                type: object
                properties:
                  hts: { type: string }
                  description: { type: string }
                  checked: { type: string, format: date }
                  hts_revision: { type: string }
                  sources_doc: { type: string }
                  rates:
                    type: array
                    items:
                      type: object
                      properties:
                        origin: { type: string }
                        total: { type: number, description: "ad valorem fraction, 0.417 = 41.7%" }
                        unverified: { type: boolean }
                        components:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              rate: { type: number }
                              heading: { type: string }
                              source: { type: string }
                              verified: { type: boolean }
                              note: { type: string }
                  lines: { type: array, items: { type: object } }
                  live_mfn: { $ref: "#/components/schemas/LiveMFN" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/rcep/check:
    post:
      operationId: checkRcepPreference
      summary: RCEP preferential origin check from a bill of materials (deterministic, no model call)
      description: >-
        Does a good made in an RCEP Party qualify as RCEP originating, so it can claim the RCEP preferential tariff
        when imported into another Party? Deterministic code over the official Annex 3A product-specific rules
        (HS 2022 transposition, parsed from the RCEP Secretariat PDF and cross-checked against the Australian Border
        Force copy; `backend/internal/rcep`, D690). Implements Art. 3.2 (wholly obtained, only originating
        materials, or the Annex 3A rule), Art. 3.4 cumulation (a material counts as originating only when declared
        originating and from a Party), Art. 3.5 RVC by both formulas (materials of undetermined origin count as
        non-originating), Art. 3.6 minimal operations and Art. 3.7 de minimis (10 % of FOB value; also 10 % of weight
        for chapters 50 to 63). Not covered: packaging (3.8), accessories (3.9), indirect and fungible materials
        (3.10, 3.11), direct consignment (3.15) and proof-of-origin procedures. Missing facts make the answer
        `undetermined`, never `no`. This is preferential origin only: it is separate from the marking and
        non-preferential origin every case answer gives, and every response says so (`regime: rcep_preferential`).
        Nothing is stored. Not a ruling and not a certificate of origin. Cheap class (120 a minute); a malformed body
        is 400 `invalid_input`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hs, produced_in]
              properties:
                hs: { type: string, example: "0910.91", description: "The good's HS code, 4 to 10 digits; the rule is looked up at 6 digits (HS 2022)" }
                produced_in: { type: string, example: Malaysia, description: "Where the good is produced: country name or ISO alpha-2 code. A non-Party is `no`." }
                fob: { type: number, exclusiveMinimum: 0, description: "FOB value of the good; needed for RVC and the value de minimis" }
                weight: { type: number, exclusiveMinimum: 0, description: "Weight of the good; used for the chapters 50-63 de minimis" }
                wholly_obtained: { type: boolean, description: "The producer states the good is wholly obtained in the Party (Art. 3.3)" }
                operations:
                  type: array
                  maxItems: 50
                  items: { type: string }
                  description: "What is done to the non-originating materials. If every entry is an Art. 3.6 key (preserving, packaging, simple_processes, marking, dilution, disassembly, slaughtering, simple_painting_polishing, simple_peeling, simple_mixing), the good does not qualify. Any other word (e.g. assembly) counts as real production."
                chemical_reaction: { type: boolean, description: "A chemical reaction took place in a Party (Annex 3A CR rule). Unset: not stated." }
                variant: { type: string, description: "For the eight rows whose rule depends on the product (e.g. 0304.39 carp vs other fish), the branch id from `rule.variants`. Unset: decided only if every branch agrees." }
                active_ingredient_originating_pct: { type: number, minimum: 0, maximum: 100, description: "Heading 38.08 only: share by weight of the active ingredients that is originating" }
                costs:
                  type: object
                  additionalProperties: false
                  description: "Build-up (direct) formula terms, Art. 3.5.1(b); same currency as fob"
                  properties:
                    labour: { type: number, minimum: 0 }
                    overhead: { type: number, minimum: 0 }
                    profit: { type: number, minimum: 0 }
                    other: { type: number, minimum: 0 }
                materials:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      name: { type: string }
                      hs: { type: string, description: "The material's HS code, 2 to 10 digits; the rule needs 2, 4 or 6" }
                      value: { type: number, minimum: 0, description: "CIF at import, or the earliest price paid in the Party (Art. 3.5.3)" }
                      weight: { type: number, minimum: 0 }
                      country: { type: string, description: "Where the material originates" }
                      status: { type: string, enum: [originating, non_originating, unknown], default: unknown, description: "originating: the supplier's declaration or proof of origin says it is RCEP originating" }
      responses:
        "200":
          description: The answer, with the rule used and plain-English reasons
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome: { type: string, enum: ["yes", "no", undetermined] }
                  basis: { type: string, enum: [WO, PE, PSR], description: "Art. 3.2 limb of a yes" }
                  applied: { type: string, example: RVC40, description: "The alternative that decided a yes, e.g. CTH, RVC40, CC except from chapter 10" }
                  rule:
                    type: object
                    properties:
                      code: { type: string, example: "0910.91" }
                      level: { type: string, enum: [chapter, heading, subheading] }
                      description: { type: string }
                      text: { type: string, example: "CC or RVC40" }
                      version: { type: string, example: rcep-psr-hs2022-r2022-08-20 }
                      variants: { type: array, items: { type: object } }
                  rvc:
                    type: object
                    properties:
                      threshold: { type: integer, example: 40 }
                      build_down: { type: number, description: "(FOB - VNM) / FOB x 100" }
                      build_up: { type: number, description: "(VOM + labour + overhead + profit + other) / FOB x 100" }
                      vnm: { type: number }
                      vom: { type: number }
                  de_minimis:
                    type: object
                    properties:
                      used: { type: boolean }
                      value_share: { type: number, description: "per cent of FOB" }
                      weight_share: { type: number, description: "per cent of the good's weight" }
                  accumulation: { type: boolean, description: "Originating materials from another Party were counted (Art. 3.4)" }
                  failing:
                    type: array
                    description: "Materials that fail (or cannot be tested against) the tariff-shift rule; empty on a yes"
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        name: { type: string }
                        hs: { type: string }
                        reason: { type: string }
                  alternatives:
                    type: array
                    items:
                      type: object
                      properties:
                        rule: { type: string }
                        outcome: { type: string, enum: ["yes", "no", undetermined] }
                        reasons: { type: array, items: { type: string } }
                  reasons: { type: array, items: { type: string } }
                  regime: { type: string, enum: [rcep_preferential] }
                  note: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: Markets a case can name, and which have an origin engine
      description: Every market and its availability on this deployment. The United States supports follow-up steps. Canada offers a marking rules check. Japan offers a preliminary trade-agreement assessment where the separate gateway is configured. Unsupported markets return no prediction and go to review.
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Market list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jurisdictions:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { $ref: "#/components/schemas/JurisdictionCode" }
                        name: { type: string }
                        supported: { type: boolean }
                        follow_ups: { type: boolean, description: "Whether the market's cases have plan search, comparison, scenarios, Ask, the draft and broker review (us only)" }
                  detector: { type: string, example: market-detect-v2, description: "Version of the deterministic market detector" }
  /v1/rules/canada-marking:
    post:
      operationId: checkCanadaMarking
      summary: Canada marking-origin rules check (SOR/94-23), from HTS codes; no model call (D720-D725)
      description: >-
        Applies Canada's Determination of Country of Origin for the Purpose of Marking Goods (CUSMA Countries)
        Regulations (SOR/94-23): the Schedule III tariff-shift row for the good, then ss. 4, 5, 9 and 11. Same output
        shape as a case's `rule_check.result`. A rules check only: Canada publishes too few origin rulings to test it,
        so there is no accuracy figure, and every answer carries `label` saying so. Send either `product` (read like the
        case's rule check: its HTS code, parts' codes and `made_in`, and the production country from its plants) or
        `good_hts`, `country` and `materials`. Headings in Canada's text are written 84.73; send codes as usual
        (8473.30). Nothing is stored. Served when RULE_CHECK is on (the default). When `result.status` is `undetermined`
        and something would resolve it, the response also carries `guidance`: yes/no facts that the request's own
        `simple_assembly`, `gri_2a` and `bending_to_shape` fields can answer (absent means unknown, false is an answer),
        codes or shares to add, and rules written by goods description that need human review.
        On the committed Canadian table today, guidance is codes, shares and human review; yes/no facts appear only for a rule that carries such a clause, and none does yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                product: { $ref: "#/components/schemas/Product" }
                good_hts: { type: string, example: "6301.30" }
                country: { type: string, description: "Where the good is produced", example: "Mexico" }
                materials:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      hts: { type: string }
                      origin: { type: string }
                      not_in: { type: string }
                      value_share: { type: number, minimum: 0, maximum: 1 }
                      weight_share: { type: number, minimum: 0, maximum: 1, description: "For de minimis by weight in chapters 50 to 63 (s. 11(1)(a))" }
                simple_assembly: { type: boolean }
                gri_2a: { type: boolean }
                bending_to_shape: { type: boolean }
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema:
                type: object
                required: [jurisdiction, rules, table_version, label, country, result, note]
                properties:
                  jurisdiction: { type: string, enum: [ca] }
                  rules: { type: string, enum: ["SOR/94-23 Schedule III"] }
                  table_version: { type: string, example: "ca-sor-94-23-v1" }
                  label: { type: string, example: "Rules check only — no accuracy figure yet (no published rulings to test against)" }
                  country: { type: string }
                  country_from: { type: string }
                  note: { type: string }
                  result: { $ref: "#/components/schemas/RuleCheck/properties/result" }
                  guidance: { $ref: "#/components/schemas/CanadaGuidance" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/demos:
    get:
      operationId: listDemos
      summary: Demo cases for the UI's "load demo" button
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Demo list
          content:
            application/json:
              schema:
                type: object
                properties:
                  demos:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: heatgun-2022 }
                        title: { type: string }
                        description: { type: string }
                        cbp_held: { type: string, example: "China (N328954)" }
                        has_plan: { type: boolean }
                        pinned_case_id: { type: string, description: "Present only when this demo has a pinned case on this site; absent means loading it starts a new live run (#412)" }
                        recorded: { $ref: "#/components/schemas/DemoRecordedRun" }
  /v1/demos/{id}:
    get:
      operationId: getDemo
      summary: One demo with ready request bodies for predict and plan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Demo
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  order: { type: integer }
                  title: { type: string }
                  description: { type: string }
                  source: { type: string }
                  cbp_held: { type: string }
                  notes: { type: string }
                  predict: { $ref: "#/components/schemas/PredictRequest" }
                  plan: { oneOf: [{ $ref: "#/components/schemas/PlanRequest" }, { type: "null" }] }
                  recorded: { $ref: "#/components/schemas/DemoRecordedRun" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/workspaces:
    post:
      operationId: createWorkspace
      summary: Create a team workspace (TEAMS=on; sign-in required)
      description: The caller becomes its admin and only member. A user can be in one workspace (409 conflict if already in one). Served only with TEAMS=on (404 otherwise). D68.
      parameters: [{ $ref: "#/components/parameters/UserToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100, description: Whitespace is collapsed } } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "201":
          description: The workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/workspaces/mine:
    get:
      operationId: getMyWorkspace
      summary: The signed-in user, their workspace and pending invitations (TEAMS=on)
      parameters: [{ $ref: "#/components/parameters/UserToken" }]
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: The user's email, workspace (null when they have none) and pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [email, workspace, invites]
                properties:
                  email: { type: string, format: email }
                  workspace: { oneOf: [{ $ref: "#/components/schemas/Workspace" }, { type: "null" }] }
                  invites:
                    type: array
                    maxItems: 20
                    description: Workspaces that have invited the user and that they have not joined
                    items:
                      type: object
                      required: [workspace_id, name, created_at]
                      properties:
                        workspace_id: { type: string }
                        name: { type: string }
                        invited_by: { type: string, format: email, description: "The admin who sent this invitation (the first sender if several admins invited the same email), even if they have since left the workspace or lost the admin role. Omitted for an invitation stored before senders were recorded: the sender is then unknown, and it is not guessed from the workspace creator." }
                        created_at: { type: string, format: date-time, description: When the workspace was created }
        "401": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{id}/members:
    post:
      operationId: inviteMember
      summary: Invite a member by email (the workspace's admin only; TEAMS=on)
      description: Records a pending invitation (listed in `invited`); the invitee is not a member, and their cases are not shared, until they sign in and call `POST /v1/workspaces/{id}/join`. Inviting again is a no-op. Whether the email is in another workspace is not checked (it would leak). 403 for a member who is not an admin (role `admin`, #283); the invitee joins as an `editor`; 404 for a workspace the caller is not in; 409 if the email is already a member of this workspace or members plus invitations reach 50.
      parameters:
        - { $ref: "#/components/parameters/UserToken" }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email, description: Lower-cased } } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "200":
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          description: The updated workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{id}/members/{email}/role:
    put:
      operationId: setMemberRole
      summary: Set a member's role (workspace admin only; TEAMS=on)
      description: "Roles are viewer, editor and admin (#283). Idempotent when the role is unchanged. 400 for a bad role, email or unknown field; 401 without a valid token; 403 for a member who is not an admin; 404 for a workspace the caller is not in (identical to an unknown one) or a target who has not joined (an invited-only email has no role); 409 if it would leave the workspace with no admin (the check and the write are atomic)."
      parameters:
        - { $ref: "#/components/parameters/UserToken" }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: email, in: path, required: true, schema: { type: string, format: email }, description: URL-encoded and lower-cased }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role], additionalProperties: false, properties: { role: { $ref: "#/components/schemas/WorkspaceRole" } } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "200":
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          description: The workspace as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{id}/members/{email}:
    delete:
      operationId: removeMember
      summary: Remove a member, or leave (TEAMS=on)
      description: "An admin may remove any member; any member may remove themself (leave). The removed user loses access to every case carrying the workspace id, including ones they created; they can be invited again and rejoin as an editor. 401 without a valid token; 403 for a non-admin removing someone else; 404 for a workspace the caller is not in or a target who is not a member; 409 if the removal would leave no admin, so a sole admin cannot leave (promote another first). Not supported yet: cancelling a pending invitation."
      parameters:
        - { $ref: "#/components/parameters/UserToken" }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: email, in: path, required: true, schema: { type: string, format: email }, description: URL-encoded and lower-cased }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "200":
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          description: The removed email and the caller's updated workspace view
          content:
            application/json:
              schema:
                type: object
                required: [removed, workspace]
                properties:
                  removed: { type: string, format: email }
                  workspace:
                    description: The caller's updated workspace, or null when the caller left
                    oneOf: [{ $ref: "#/components/schemas/Workspace" }, { type: "null" }]
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/workspaces/{id}/join:
    post:
      operationId: joinWorkspace
      summary: Accept an invitation to a workspace (TEAMS=on)
      description: The caller must have been invited by email (`GET /v1/workspaces/mine` lists invitations). 404 without an invitation or for an unknown workspace; 409 if the caller is already in a workspace or it has 50 members. Only cases created after joining belong to the workspace. No request body.
      parameters:
        - { $ref: "#/components/parameters/UserToken" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        "200":
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          description: The workspace joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/audit:
    get:
      operationId: listAudit
      summary: List a tenant's audit events (workspace admin or admin token; audit enabled only)
      description: "Registered only when the audit trail is enabled (404 otherwise). The tenant is implied by the caller: a signed-in user whose current stored role is admin reads `ws:<their workspace id>`. The admin token must give `tenant`; any other caller giving `tenant` gets 400. Editors, viewers, users without a workspace, API keys and visitors get 403 `forbidden` (401 `unauthenticated` for an unverified caller under STRICT_AUTH). A personal tenant has no tenant admin: only the admin token can read it. Events are ordered by the per-tenant `seq`. A page may hold fewer than `limit` events and still carry `next_cursor`, so keep following it until it is absent. A cursor is bound to the tenant, order and filters; one from another tenant, order or filter set, or a forged one, is 400. Reading the first page is itself audited. Retention is `retention_days` (default 90); purged events leave a checkpoint."
      security: [{ AdminToken: [] }, {}]
      parameters:
        - { name: X-User-Token, in: header, required: false, description: "The signed-in user's Google ID token (D68); the workspace admin's way in. The admin token is the other.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, description: Opaque; at most 512 bytes, schema: { type: string, maxLength: 512 } }
        - { name: order, in: query, schema: { type: string, enum: [desc, asc], default: desc } }
        - { name: action, in: query, schema: { $ref: "#/components/schemas/AuditAction" } }
        - { name: outcome, in: query, schema: { $ref: "#/components/schemas/AuditOutcome" } }
        - { name: phase, in: query, schema: { $ref: "#/components/schemas/AuditPhase" } }
        - { name: actor, in: query, description: An actor pseudonym from an event, never an email, schema: { type: string } }
        - { name: object, in: query, description: An opaque object reference from an event, schema: { type: string } }
        - { name: from, in: query, description: RFC 3339, on `time`, schema: { type: string, format: date-time } }
        - { name: to, in: query, description: RFC 3339, on `time`, schema: { type: string, format: date-time } }
        - { name: tenant, in: query, description: Admin token only (required for it); 400 for any other caller, schema: { type: string } }
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/audit/verify:
    get:
      operationId: verifyAudit
      summary: Verify the hash chain of a tenant's retained audit events (workspace admin or admin token; audit enabled only)
      description: "Same access rules and tenant rules as `GET /v1/audit`. Scans at most 5000 events per call and reports at most 100 findings per call. Verification is a snapshot: the first call freezes the head, and `verified_through_seq` says how far it checked; events appended later are outside it. When `complete` is false, call again with `next_cursor` until `complete` is true. `ok` and `findings` cover only the events checked so far in this call. A retention purge that runs during a multi-call verification answers 409 `conflict`; start again without a cursor (a legitimate purge is never a finding). `unresolved_intents` is present only on the final call (`complete` true) and is absent on every incomplete page, so its absence never means that none were found; it lists intents older than 5 minutes (a cutoff frozen at the first call) with no completion or failure as of `verified_through_seq` (an in-doubt write), at most 50 seqs. A completion that arrived after that snapshot is not read. Its own `complete` is false when more than 64 intents were open at a page boundary, and `count` is then not exact. Verification checks the chain against the stored head and the retention checkpoint, so a legitimate purge is not reported as tampering. This is application-level tamper evidence only (see the audit paragraph above)."
      security: [{ AdminToken: [] }, {}]
      parameters:
        - { name: X-User-Token, in: header, required: false, description: "The signed-in user's Google ID token (D68); the workspace admin's way in.", schema: { type: string } }
        - { name: cursor, in: query, description: Resume token from a previous incomplete call, schema: { type: string, maxLength: 512 } }
        - { name: tenant, in: query, description: Admin token only (required for it); 400 for any other caller, schema: { type: string } }
      responses:
        "409": { $ref: "#/components/responses/Error" }
        "200":
          description: The verification result so far
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/eval/summary:
    get:
      operationId: getEvalSummary
      summary: Evaluation numbers for the results page (from eval/RESULTS.md runs)
      responses:
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvalSummary" }
  /v1/admin/api-keys:
    post:
      operationId: issueApiKey
      summary: Issue an API key (admin token required; API_KEYS=on only)
      description: Returns the key once, in `key`. Only its SHA-256 is stored, so it cannot be shown again; issue a new one if it is lost (D69).
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, daily_quota]
              properties:
                name: { type: string, maxLength: 100, description: Who the key is for }
                daily_quota: { type: integer, minimum: 1, maximum: 1000000, description: Requests a UTC day }
      responses:
        "503": { $ref: "#/components/responses/Error" }
        "201":
          headers:
            X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" }
          description: The key, shown once, and its record
          content:
            application/json:
              schema:
                type: object
                required: [key, api_key]
                properties:
                  key: { type: string, pattern: "^op_[A-Za-z0-9_-]{43}$", description: "Send as X-API-Key. Not stored; shown only here." }
                  api_key: { $ref: "#/components/schemas/APIKey" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    get:
      operationId: listApiKeys
      summary: List API keys without secrets (admin token required)
      security: [{ AdminToken: [] }]
      responses:
        "200":
          description: Every key, newest first, disabled ones included
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/api-keys/{id}:
    delete:
      operationId: disableApiKey
      summary: Disable an API key for good (admin token required)
      description: The record stays in the list with `disabled` true; requests with the key then get 401.
      security: [{ AdminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{16}$" } }
      responses:
        "503": { $ref: "#/components/responses/Error" }
        "204": { description: Disabled, headers: { X-Audit-Incomplete: { $ref: "#/components/headers/AuditIncomplete" } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /mcp:
    post:
      operationId: mcp
      summary: Model Context Protocol endpoint (Streamable HTTP, stateless JSON-RPC)
      description: |
        The Unde API as MCP tools for Claude and other MCP clients; see docs/MCP.md. Public URL: https://undelabs.dev/mcp (the frontend proxies it to the backend). Stateless: no Mcp-Session-Id is issued, and GET and DELETE answer 405. Send `Authorization: Bearer op_...` (or `X-API-Key`) to act as an API key; without one the caller is anonymous with the per-address limits. The admin token is refused (403). Each tool call runs one `/v1` operation in-process, with that operation's rate-limit class, API-key quota, spend cap, case isolation and audit row. The POST itself counts once against the caller's basic class (D137); a tool call that is refused by a limit returns a tool error with `retry_after`. docs/MCP.md maps each tool to its operationId (for example predict_origin to predictCase).
      security: [{}, { ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "A JSON-RPC 2.0 request (MCP)" }
      responses:
        "200":
          description: The JSON-RPC response, as application/json or a text/event-stream
        "400": { description: Malformed MCP request }
        "403": { description: The admin token was sent }
        "405": { description: Only POST is served }
        "413": { description: The body is over 12 MB }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A broker's key, `op_` plus 43 characters, issued by the admin (D69; only with API_KEYS=on). Optional: requests without it are served as before. A key gets its own rate-limit buckets (instead of the X-Client-IP ones), a request quota per UTC day (over it: 429 `quota_exceeded` with Retry-After at the next UTC day), and owns the cases it creates. An unknown or disabled key gets 401 `unauthorized`. Model calls still count toward the daily spend cap (503 `budget_reached`).
    ReviewToken:
      type: apiKey
      in: header
      name: X-Review-Token
      description: A broker review link's token, `ubr_` plus the case id's 12 hex digits, `_` and 43 characters (256 random bits), made by the case owner with createBrokerReviewLink (D200). It opens one link's snapshot only. Stored as a SHA-256 hash and compared in constant time.
    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: The deployment's admin token (seeding, pinning, issuing API keys). Never sent from the browser.
  parameters:
    VisitorID:
      name: X-Visitor-ID
      in: header
      required: false
      description: "An anonymous browser's id, set by the frontend proxy from an httpOnly cookie (D58). With CASE_OWNERSHIP=on it scopes which cases a visitor sees; it is not authentication (STRICT_AUTH=on refuses it alone for private case operations). Server-to-server callers use X-API-Key instead and need not send it. Accepted on every /v1 route."
      schema: { type: string, maxLength: 64 }
    ClientIP:
      name: X-Client-IP
      in: header
      required: false
      description: "The browser's address, forwarded by the frontend proxy; it keys the per-client limits (IPv6 grouped by /64). Without it the connection's address is used. A request with a valid X-API-Key is keyed by the key instead. Accepted on every /v1 route."
      schema: { type: string, maxLength: 64 }
    CaseID:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserToken:
      name: X-User-Token
      in: header
      required: true
      description: The signed-in user's Google ID token, forwarded by the frontend proxy (D68). Optional on every other endpoint.
      schema: { type: string }
  headers:
    RateLimitLimit:
      description: "The size of the caller's bucket for this route's rate class (IETF draft RateLimit header fields, D137). Sent on every rate-limited route when the limit is on; absent for the admin token."
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the bucket after this one (0 on a 429).
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the bucket is full again (per-instance buckets) or until the current one-minute window ends (shared counters).
      schema: { type: integer }
    RetryAfter:
      description: Seconds to wait before retrying. On 429 `rate_limited` until the bucket or window allows the request; on `quota_exceeded` and `client_budget_reached` (and 503 `budget_reached`) until 00:00 UTC; on `too_many_in_flight` 5; on `auth_rate_limited` until another key may be tried.
      schema: { type: integer }
    AuditIncomplete:
      description: "Set to `completion-not-recorded` when the audit trail is enabled and the completion or single event of an audited request could not be stored. It can appear on ANY audited route that is not a Server-Sent-Events stream, on a success OR an error response, not only on the fail-closed operations that can answer 503: every mutating route, a recording or preview export of a non-pinned case, the audit read and verify routes, and the API-key list. For a write, the change stands and the response status is the true one. It is never sent on a Server-Sent-Events response, whose headers are committed before the work runs, so a stream that could not record its completion carries no header and the trail holds an intent without a completion. It is not present when the audit trail is off."
      schema: { type: string, enum: [completion-not-recorded] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Refused by a limit (D137, docs/api/SECURITY.md). `code` says which: `rate_limited` (the route's rate class), `too_many_in_flight` (too many model-calling requests running at once), `client_budget_reached` (this client's share of the day's model budget is spent), `quota_exceeded` (the API key's daily request quota) or `auth_rate_limited` (too many invalid API keys from this client). `details.retry_after_s` repeats `Retry-After`.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    PartHtsCandidate:
      type: object
      properties:
        hts: { type: string, example: "8501.31", description: "4, 6 or 8 digits, at the level stated" }
        source: { type: string, enum: [rulings, model], description: "rulings: an earlier CBP ruling states this code for a similar part; model: the model's own reading, no supporting ruling" }
        reason: { type: string, description: "empty when reasons_unavailable" }
        supporting_rulings:
          type: array
          items: { type: object, properties: { id: { type: string }, date: { type: string, format: date }, part: { type: string }, sentence: { type: string }, subject: { type: string }, url: { type: string } } }
        cited: { type: array, items: { type: string } }
        check:
          type: string
          description: |
            Present when the code looks wrong for the product (D471), with why and "check this code": a chapter far from the
            product's family (food, clothing, footwear, jewellery and the like for a part of a machine, an appliance, a vehicle
            or a device), or a chapter of another material than the part's name states (a "steel" part coded as plastics). A
            deterministic check on the part candidates only. The code is kept in its place; nothing is removed or reordered.
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        llm_provider: { type: string }
        version: { type: string }
        checks:
          type: object
          description: deep=1 only; keys case_store and model
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              latency_ms: { type: integer }
              error: { type: string, example: "rpc error: code = PermissionDenied desc = Missing or insufficient permissions." }
    CaseSummary:
      type: object
      required: [id, product_name, display_name, date, predicted_origin, triage_route, confidence, step, updated_at, watch_status, scenario_count, pinned]
      properties:
        id: { type: string }
        product_name:
          type: string
          description: Structured product name, or the first words of the facts for a facts-only case
        display_name: { type: string, description: "The user's name for the case (PATCH /v1/cases/{id}), else product_name. Show this on Cases home." }
        date: { type: string, format: date, description: Case date }
        predicted_origin: { type: [string, "null"], description: null until analysed }
        triage_route:
          type: [string, "null"]
          enum: [auto, needs_review, needs_info, null]
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        calibrated_confidence: { type: [number, "null"], description: "Calibrated probability (D160); null when the prediction has none" }
        step:
          type: string
          enum: [product, origin, plan, export]
          description: Furthest workflow step reached (export once a draft has been exported)
        updated_at: { type: string, format: date-time }
        watch_status: { type: [string, "null"], enum: [unchanged, changed, null], description: null until re-checked }
        watch_basis: { type: [string, "null"], enum: [precedent, regime, method, specialist_unavailable, unverified, null], description: "Why (Watch.basis); null until re-checked or for a watch saved without it, which is unknown, not confirmed. With watch_status set and watch_basis null the result is a legacy one: read it as unknown and re-check (the screens show Re-check needed), never as Changed or Unchanged" }
        watch_route: { type: [string, "null"], enum: [auto, needs_review, needs_info, null], description: "Route of the watch result's triage (Watch.triage.route); null as watch_basis" }
        scenario_count: { type: integer }
        pinned: { type: boolean, description: A seeded demo case; listed first }
        demo_id: { type: string, description: "Present on pinned rows seeded from a demo fixture; the demo's id (#412)" }
        can_write: { type: boolean, description: "Present on list rows; whether the caller may change this case (#283). Computed by the server for each request with the same authorization the write routes use; hidden cases are never returned, and the value is never stored or taken from the client. Pinned demos are false for non-admin callers, but that means no persisted change only: Ask, scenarios and plan previews on a pinned demo stay read-only and allowed. The server still enforces every action (403 forbidden)." }
        ruling_alerts: { $ref: "#/components/schemas/RulingAlertCounts" }
        review_status:
          type: string
          enum: [pending, viewed, approved, changes_requested, file_requested, expired]
          description: "Status of the case's newest non-revoked broker review link (#715), read from the links already on the case: the latest created, the later in the list when two share a time. A link past its expiry reads `expired`, never `pending`. Absent when the case has no link or only revoked ones, and for a pinned demo to non-admin callers. `approved` and `file_requested` are information only: no follow-up is implied."
        review_expires_at: { type: string, format: date-time, description: "That link's expiry; present only while its status is pending or viewed (#715)" }
    RulingAlertCounts:
      type: object
      description: "Present only when CBP has changed (final) or proposed to change a ruling the case relies on: cited by the prediction, a shown plan's supporting ruling, or CBP's holding on the current setup (D480)."
      required: [final, proposed]
      properties:
        final: { type: integer, description: "Rulings with a final revocation or modification, in force or scheduled" }
        proposed: { type: integer, description: "Rulings with a pending proposal only (information)" }
        read_only: { type: integer, description: "On a case: final changes to rulings the prediction read but did not cite" }
        touches_answer: { type: integer, description: "Final changes to relied-on rulings whose held origin moved to or from what the case relies on the ruling for: the answer for a cited ruling, a shown plan's target for its supporting ruling, CBP's holding on the current setup for that ruling (D531, D561); absent when none" }
    RulingAlerts:
      type: object
      description: "CBP's changes to the rulings a saved case relies on or read (D480), from backend/internal/domain/supersession.json (corpus letters and fetched Customs Bulletin notices). Present only when there is at least one. Information only: the stored answer is never changed. Re-check with POST /v1/cases/{id}/watch."
      required: [counts, items]
      properties:
        counts: { $ref: "#/components/schemas/RulingAlertCounts" }
        rechecked_at: { type: string, format: date-time, description: "Present when the ruling watch re-ran the case on or after the latest final change in force to a ruling it relies on" }
        items:
          type: array
          items:
            type: object
            required: [ruling, roles, status, kind, by, note]
            properties:
              ruling: { type: string }
              roles: { type: array, items: { type: string, enum: [cited, plan_support, current_setup, read] } }
              status: { type: string, enum: [final, proposed] }
              kind: { type: string, enum: [revoked, modified] }
              by: { type: string, description: "The revoking or modifying ruling (proposed: the proposed one)" }
              date: { type: string, format: date, description: "The change's date: the letter's issue date, or a bulletin notice's effective date. Absent for a proposal." }
              in_effect: { type: boolean, description: "true when a final change's date is today or earlier; absent for a scheduled one" }
              before_case: { type: boolean, description: "true when a final change is dated before the case date: the guard (D320, D370) would refuse to cite it today, so the answer was stored before the guard" }
              bulletin: { type: string, description: "Customs Bulletin citation, when a notice published the change" }
              url: { type: string }
              note: { type: string, description: "The change in words, e.g. revoked by H346161 on 2025-05-05" }
              held_before: { type: string, description: "The origin the changed ruling held, from the shipped labels (D531); absent when not known" }
              held_after: { type: string, description: "The origin the changing ruling holds, from the shipped labels (D531); absent when not known" }
              answer: { type: string, description: "The case's predicted origin the change is compared with (D531)" }
              relevance:
                type: string
                enum: [touches_answer, not_answer, holding_unchanged, unknown]
                description: "Whether the change bears on what the case relies on the ruling for (D531, D561), judged per role: a cited ruling against the predicted origin, a plan's supporting ruling against the plan's target, the current setup's ruling against CBP's holding there; with several roles the most relevant label is kept and relevance_role names the role. touches_answer, the held origin moved to or from that country; not_answer, it moved between two other countries; holding_unchanged, the same origin before and after; unknown, an origin or that country is not known. Information only; a re-check is recommended either way."
              relevance_note: { type: string, description: "The relevance in one or two sentences, as the site and MCP show it" }
              relevance_role: { type: string, enum: [cited, plan_support, current_setup, read], description: "The role the relevance was judged for (D561)" }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_input, not_found, model_unavailable, model_bad_response, out_of_scope, internal, rate_limited, too_many_in_flight, client_budget_reached, auth_rate_limited, forbidden, budget_reached, unauthenticated, conflict, unauthorized, quota_exceeded, audit_unavailable, review_not_found, link_revoked, link_expired]
        message: { type: string }
        details: {}
    Workspace:
      type: object
      description: A team workspace (D68); its members see each other's cases.
      required: [id, name, members, invited, created_by, created_at, admin, role]
      properties:
        id: { type: string, example: ws_3f9a2c1b7d4e }
        name: { type: string }
        members: { type: array, items: { type: string, format: email }, description: Users who created or joined it }
        invited: { type: array, items: { type: string, format: email }, description: Pending invitations, not yet members }
        created_by: { type: string, format: email, description: The workspace's creator }
        created_at: { type: string, format: date-time }
        admin: { type: boolean, description: The caller's role is admin }
        role: { $ref: "#/components/schemas/WorkspaceRole" }
        member_roles:
          type: object
          description: Role of each joined member by email. Present only when the caller is an admin; invited-only emails never appear.
          additionalProperties: { $ref: "#/components/schemas/WorkspaceRole" }
    WorkspaceRole:
      type: string
      enum: [viewer, editor, admin]
      description: The caller's role in the workspace, derived by the server from stored membership.
    AuditAction:
      type: string
      enum: [case.create, case.update, case.export, case.delete, case.pin, case.read, workspace.create, workspace.invite, workspace.join, workspace.role_change, workspace.member_remove, workspace.leave, apikey.issue, apikey.list, apikey.disable, admin.watch_run, audit.read, audit.verify, auth.denied]
      description: "`case.read` appears only as a denial; allowed ordinary reads are not audited."
    AuditPhase:
      type: string
      enum: [intent, completion, single]
    AuditOutcome:
      type: string
      enum: [allowed, denied, failed]
    AuditEvent:
      type: object
      description: "One audit event, as stored. Every string is a closed value or a strict pattern: no credential, request body, email, name or legal fact is recorded. Fields with no value are omitted from the JSON."
      required: [tenant, seq, time, actor_kind, action, phase, outcome, prev_hash, hash]
      properties:
        tenant: { type: string, description: "`ws:<workspace id>`, `own:<owner hash>` (a personal tenant, readable by the admin token only) or `platform`" }
        seq: { type: integer, description: Per-tenant sequence, total and deterministic }
        time: { type: string, format: date-time, description: Server clock in microseconds; non-decreasing within a tenant }
        actor_kind: { type: string, enum: [user, apikey, admin, anonymous, system] }
        actor: { type: string, description: "A keyed pseudonym `a<keyid>_<32 hex>` of a verified user or API key; omitted for admin, anonymous and system. Never an email. A pseudonym is not anonymisation: whoever holds the key can confirm a guess." }
        target: { type: string, description: The affected member's pseudonym for invite, join, role change and removal; otherwise omitted }
        action: { $ref: "#/components/schemas/AuditAction" }
        phase: { $ref: "#/components/schemas/AuditPhase" }
        outcome: { $ref: "#/components/schemas/AuditOutcome" }
        reason:
          type: string
          enum: [forbidden, hidden, unauthenticated, invalid_credential, invalid_input, conflict, not_found, upstream, unavailable, internal, superseded, audit_unavailable, rate_limited]
          description: Omitted when allowed
        detail: { type: string, description: "A closed value per action (the case.update kind, the export format, the new role, pin or unpin) or omitted" }
        object: { type: string, description: "A server-minted id (`case:case_<12 hex>`, `workspace:ws_<12 hex>`, `apikey:<16 hex>`, `apikey:new`, `batch`) or, for an id the requester supplied and the server did not resolve, a keyed opaque hash `<kind>:h_<16 hex>`; omitted when none. Never a name." }
        route: { type: string, description: The route pattern, with path parameters unexpanded }
        request_id: { type: string, description: "The request reference: 16 server-minted hex characters, or `h_` plus the first 16 hex of the SHA-256 of a client-supplied X-Request-ID. A client value is never stored raw." }
        ref: { type: integer, description: "On a completion or failure, the seq of its intent; omitted when the event has none, including when the intent could not be written" }
        suppressed: { type: integer, description: "Present only when above 0: denial events dropped by the per-process flood limiter since the previous event for this tenant. The count is per process, not fleet wide." }
        prev_hash: { type: string, description: "The previous event's hash; 64 zeros for seq 1" }
        hash: { type: string, description: "SHA-256 over a fixed encoding of the other fields" }
    AuditPage:
      type: object
      required: [tenant, retention_days, order, events]
      properties:
        tenant: { type: string }
        retention_days: { type: integer }
        order: { type: string, enum: [desc, asc] }
        events: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        next_cursor: { type: string, description: Omitted at the end. Opaque; bound to tenant, order and filters. }
    AuditVerifyResult:
      type: object
      description: "Verification covers only the events checked in this call. `ok` is true only for what was checked; read `complete` and `unresolved_intents` as described."
      required: [tenant, ok, checked, verified_through_seq, complete, findings]
      properties:
        tenant: { type: string }
        ok: { type: boolean }
        checked: { type: integer }
        verified_through_seq: { type: integer, description: "The head frozen by the first call: the highest seq this verification covers. Later appends are outside it." }
        first_seq: { type: integer }
        last_seq: { type: integer }
        checkpoint:
          type: object
          description: The retention checkpoint a legitimate purge left
          properties:
            through_seq: { type: integer }
            purged_at: { type: string, format: date-time }
        complete: { type: boolean, description: "False while more remains; then call again with `next_cursor`" }
        next_cursor: { type: string, description: Present while `complete` is false }
        findings:
          type: array
          maxItems: 100
          description: At most 100 per call
          items:
            type: object
            required: [seq, kind]
            properties:
              seq: { type: integer }
              kind: { type: string, enum: [hash_mismatch, prev_mismatch, seq_gap, seq_reorder, time_regression, head_mismatch, checkpoint_mismatch, prefix_unanchored, tenant_mismatch, invalid_event] }
        unresolved_intents:
          type: object
          description: "Present ONLY on the final call (`complete` true), never on an incomplete page, so absence does not mean none were found. Intents older than 5 minutes (a cutoff frozen at the first call) with no completion or failure as of `verified_through_seq`; a later completion is not read. `complete` is false when more than 64 intents were open at a page boundary, and `count` is then not exact."
          required: [count, seqs, complete]
          properties:
            count: { type: integer, description: "Not exact when `complete` is false" }
            seqs: { type: array, items: { type: integer }, description: At most 50 }
            complete: { type: boolean, description: "False when more than 64 intents were open at a page boundary; `count` is then not exact" }
    APIKey:
      type: object
      description: A stored API key; the secret and its hash are never returned (D69).
      required: [id, name, created_at, daily_quota, disabled]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{16}$" }
        name: { type: string }
        created_at: { type: string, format: date-time }
        daily_quota: { type: integer, description: Requests a UTC day }
        disabled: { type: boolean }
    Meta:
      type: object
      required: [model_ids, prompt_versions, llm_provider, disclaimer]
      properties:
        model_ids: { type: object, additionalProperties: { type: string }, example: { engine: gemini-4-argon, router: gemini-3.8-flash } }
        prompt_versions: { type: object, additionalProperties: { type: string }, example: { engine: engine-v1, router: router-v4 } }
        llm_provider: { type: string, enum: [vertex, fake], description: "fake results are simulated, local development only; earlier litellm results are labelled proxy (D49)" }
        disclaimer: { type: string, example: "Not a ruling. Confirm with a licensed customs broker or a CBP binding ruling." }
    Plant:
      type: object
      required: [id, country]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        capabilities: { type: array, items: { type: string }, description: Operation groups this plant can perform }
    Component:
      type: object
      required: [name, made_in]
      properties:
        name: { type: string }
        made_in: { type: string }
        plant: { type: string, description: Plant ID when made at one of the product's own plants }
        group: { type: string, description: Operation group that produces it }
        hts: { type: string, pattern: "^[0-9]{4}(?:[. ]?[0-9]{2}){0,3}$", example: "7616.99", description: "Optional HTS heading or subheading of the part. Read only by the 19 CFR 102.20 rule check (rule_check, D363); not part of the facts." }
        hts_alternatives:
          type: array
          maxItems: 2
          items: { type: string, pattern: "^[0-9]{4}(?:[. ]?[0-9]{2}){0,3}$" }
          example: ["7220.20"]
          description: "When hts was accepted from a suggestion (POST /v1/products/parts-hts-suggest): the other codes suggested for the part. Read only by the rule check's robustness test (rule_check.robustness, D430); not part of the facts."
    CanadaGuidance:
      type: object
      description: "What would resolve an undetermined Canada marking result. Present only when result.status is undetermined and at least one item applies; never on out_of_scope, decided or invalid (400) requests. Review items are never answerable: no request field settles them."
      required: [state, missing]
      properties:
        state:
          type: string
          enum: [answerable, needs_input, needs_review]
          description: "answerable: a yes/no fact the request can state would move the answer. needs_input: only a code, share or origin is missing. needs_review: only a person can go further."
        missing:
          type: array
          items:
            type: object
            required: [key, kind, label, answerable, blocking]
            properties:
              key:
                type: string
                enum: [simple_assembly, gri_2a, bending_to_shape, good_code, country, material_hts, material_code, material_origin, value_share, weight_share, goods_description, person_reading]
                description: "The first three are the request's own boolean fields."
              kind: { type: string, enum: [fact, code, share, review] }
              material: { type: integer, minimum: 0, description: "0-based index into the request's materials (or product components); omitted for the whole case. 0 is a real index." }
              label: { type: string }
              detail: { type: string }
              answerable: { type: boolean, description: "True only for a fact the request can carry as a boolean" }
              blocking: { type: boolean, description: "Resolving it can change the answer" }
        review:
          type: object
          required: [reason]
          description: "Present when an item needs a person"
          properties:
            reason: { type: string }
    RuleCheck:
      type: object
      description: "The deterministic 19 CFR 102.20 tariff-shift check (D360, D363), present only when the product gives an HTS code for the good and at least one part. Computed when the case is read; display only: it never changes the prediction, the triage or auto-accept. RULE_CHECK=off removes it."
      required: [rules, applies, country, country_from, result, review, note]
      properties:
        rules: { type: string, enum: ["19 CFR 102.20"] }
        applies: { type: string, enum: [part102, informational], description: "part102 when the router sent the case to the Part 102 rules; informational when it is decided under substantial transformation" }
        country: { type: string, description: "Country of production the check used; empty when not known" }
        country_from: { type: string, description: "How the country was read from the product (final assembly plant, plant of the last operation, the only plant)" }
        model_origin: { type: string }
        agrees: { type: boolean, description: "Present only when the check decided: whether it names the model's origin" }
        review: { type: boolean, description: "True when the decided check differs from the model: worth a person's look. Does not change the triage route" }
        note: { type: string }
        result:
          type: object
          required: [status, reason]
          properties:
            status: { type: string, enum: [decided, undetermined, out_of_scope] }
            origin: { type: string }
            basis: { type: string, description: "The paragraphs and 102.20 row that decided it" }
            reason: { type: string }
            assumes: { type: array, items: { type: string } }
            if_not_de_minimis:
              type: object
              description: "When only the 102.13 de minimis value is open: the answer if the materials that do not shift are worth more than 7% of the good"
              properties:
                origin: { type: string }
                basis: { type: string }
                condition: { type: string }
            rule:
              type: object
              properties:
                id: { type: string, example: "19 CFR 102.20(o), 8473" }
                hts: { type: string }
                text: { type: string, description: "Verbatim eCFR text of the row" }
                alternatives: { type: integer }
                encoded: { type: integer }
            materials:
              type: array
              items:
                type: object
                required: [name, origin, foreign, status]
                properties:
                  name: { type: string }
                  hts: { type: string }
                  origin: { type: string }
                  foreign: { type: boolean }
                  status: { type: string, enum: [shift, no_shift, needs_fact, missing_hts] }
                  alternative: { type: integer, description: "1-based alternative of the row the part satisfies" }
                  needs: { type: array, items: { type: string } }
        robustness:
          type: object
          description: "Present when a part carries other suggested codes (components[].hts_alternatives): the check run on every combination of each part's codes (a deterministic sample past 81), and whether the answer is the same under all of them (D430). Display only."
          required: [stable, combinations, evaluated, sampled, parts, outcomes, summary]
          properties:
            stable: { type: boolean, description: "Every combination gives the same status and, when decided, the same origin" }
            combinations: { type: integer }
            evaluated: { type: integer }
            sampled: { type: boolean, description: "More than 81 combinations: the codes carried, every single-part change from them, then evenly spaced combinations" }
            parts: { type: array, items: { type: string }, description: "Parts with more than one code" }
            depends_on: { type: array, items: { type: string }, description: "Parts whose code alone changes the answer" }
            outcomes:
              type: array
              items:
                type: object
                required: [status, count]
                properties:
                  status: { type: string, enum: [decided, undetermined, out_of_scope] }
                  origin: { type: string }
                  count: { type: integer }
            summary: { type: string, example: "the same answer for every suggested code (2 combinations of the codes suggested for flat coiled stainless steel)" }
    Operation:
      type: object
      required: [name, plant]
      properties:
        name: { type: string }
        plant: { type: string }
        group: { type: string }
    Product:
      type: object
      required: [name, components]
      properties:
        name: { type: string }
        family: { type: string }
        description: { type: string }
        plants: { type: array, items: { $ref: "#/components/schemas/Plant" } }
        components: { type: array, items: { $ref: "#/components/schemas/Component" } }
        operations: { type: array, items: { $ref: "#/components/schemas/Operation" } }
        hts: { type: string, example: "8419.89.95", description: "Optional tariff subheading; fills duty rates from the sourced table (GET /v1/duty-rates, D52). Not part of the facts." }
    PredictRequest:
      type: object
      description: Either `facts` (pasted text, max 12,000 characters) or a structured `product` is required. U.S. cases without facts need a planner family. Japan cases can give the agreement and finished-good tariff code in `japan`.
      required: [date]
      properties:
        date: { type: string, format: date, description: Case date; only rulings dated strictly before it are used }
        facts: { type: string, maxLength: 12000 }
        product: { $ref: "#/components/schemas/Product" }
        family: { type: string, example: motorised_tools_small_appliances }
        exclude_rulings: { type: array, items: { type: string }, description: Rulings about this very case, never used as precedent }
        current_origin:
          type: object
          description: CBP's holding on the current setup, if the user has one
          properties:
            country: { type: string }
            ruling: { type: string }
        economics:
          description: Optional money inputs, kept on the case for plan, scenarios and compare-targets calls that omit their own (also editable later with PUT /v1/cases/{id}/economics)
          allOf: [{ $ref: "#/components/schemas/Economics" }]
        display_name: { type: string, maxLength: 200, description: "Optional name for the case on Cases home (D48); batch rows pass their name here" }
        jurisdiction:
          description: Market the question is for. If omitted, a Japan input selects Japan. Otherwise the server reads it from the facts or defaults to the United States. See GET /v1/jurisdictions for current availability.
          allOf: [{ $ref: "#/components/schemas/JurisdictionCode" }]
        japan: { $ref: "#/components/schemas/JapanInput" }
    JapanInput:
      type: object
      description: Trade-agreement inputs for imports into Japan. A configured Japan assessment goes to review if the agreement, tariff code or applicable rule is missing.
      required: [agreement, hs]
      properties:
        agreement: { type: string, example: RCEP, description: "Agreement name or corpus code, such as RCEP, CPTPP, JP-EU EPA or AJCEP" }
        hs: { type: string, example: "4412.31", description: "Finished-good tariff classification for Japan. Include the full Japanese code where the agreement rule requires it." }
    JapanSource:
      type: object
      required: [citation, url]
      properties:
        citation: { type: string }
        url: { type: string, format: uri }
    JapanResult:
      type: object
      description: Preliminary Japan preferential-origin assessment. Every result requires specialist review. Published evaluation rulings only cover goods that qualified. Not a ruling.
      required: [agreement, hs, outcome]
      properties:
        agreement: { type: string }
        hs: { type: string }
        outcome: { type: string, enum: [qualifies, does_not_qualify, undetermined] }
        criterion: { type: string }
        deciding_rule: { type: string }
        review_reason: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/JapanSource" } }
        precedent_sources: { type: array, items: { $ref: "#/components/schemas/JapanSource" } }
    JurisdictionCode:
      type: string
      enum: [us, eu, uk, ca, jp, kr, au, mx, other]
      description: "Market codes: us United States, eu European Union, uk United Kingdom, ca Canada, jp Japan, kr South Korea, au Australia, mx Mexico, other any other market"
    JurisdictionDetail:
      type: object
      required: [code, name, source, supported, follow_ups]
      properties:
        code: { $ref: "#/components/schemas/JurisdictionCode" }
        name: { type: string, example: United States }
        source: { type: string, enum: [chosen, detected, default], description: "chosen: the caller named it; detected: a cue in the text; default: no cue (a case made before D680 also reads default)" }
        cue: { type: string, description: 'What set a detected market, e.g. "HMRC" or "entry into Canada"' }
        hint: { type: string, description: "A non-U.S. market the text suggests but that was not taken (a price, \"sold in\", or a cue contradicted by a U.S. one). On a case the router labels unclear it sends the case to review." }
        supported: { type: boolean, description: "Whether the market has an origin engine. false: no prediction was made" }
        follow_ups: { type: boolean, description: "Whether the case has plan search, comparison, scenarios, Ask, the draft and broker review. Only us has them; on any other market those calls return 400 (#678)" }
    WhatIf:
      type: object
      description: One re-run of the origin engine on revised facts
      properties:
        change: { type: string }
        origin: { type: string }
        confidence: { type: number, description: "The model's stated confidence" }
        calibrated_confidence: { type: number, description: "Calibrated probability when one applies (D160); see Prediction.calibrated_confidence" }
        decisive_step: { type: string }
        facts: { type: string, description: "The revised facts the engine re-ran: trimmed, with one terminal newline. The same string is stored on the chat turn and is accepted unchanged by POST /v1/cases/{id}/scenarios (D116)." }
        regime: { type: string, description: 'Regime whose engine answered this what-if (textile_102_21, usmca_part102, pharma_api, substantial_transformation). "unknown" when the stored trace does not say, "unclassified" when the answering predictor had no dispatch. A saved what-if recorded before this field existed is written as "unknown" with a provisional note and is never to be read as confirmed (#319, D100).' }
        specialist: { type: string, description: 'State of the selected specialist engine for this what-if (ok, failed, unconfigured); omitted when no specialist was selected' }
        scope: { type: string, description: 'Scope state of the run (no_router, configured_failed, confirmed, label_missing)' }
        route: { type: string, description: 'Triage route the same policy as a saved scenario gives these facts (auto, needs_review, needs_info)' }
        triage_reason: { type: string, description: 'Reason for the route' }
        provisional: { type: string, description: 'Set, with its reason, when the result is not regime-confirmed, for example a general answer after a specialist failure' }
    ChatStep:
      type: object
      properties:
        tool: { type: string }
        arg: { type: string }
    ChatTurn:
      type: object
      properties:
        question: { type: string }
        answer: { type: string }
        cited_rulings: { type: array, items: { type: string } }
        at: { type: string, format: date-time }
        what_ifs: { type: array, items: { $ref: "#/components/schemas/WhatIf" } }
        steps: { type: array, items: { $ref: "#/components/schemas/ChatStep" } }
    Prediction:
      type: object
      properties:
        origin_country: { type: string, description: "For Japan, the predicted preferential origin when the goods qualify and a country is known." }
        japan_preference: { $ref: "#/components/schemas/JapanResult" }
        key_factors: { type: array, items: { type: string } }
        decisive_step: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1, description: "The model's own stated confidence. Overconfident on average (stated 94.7% against 90.2% right on the 377 held-out rulings); use calibrated_confidence when present." }
        calibrated_confidence: { type: number, minimum: 0, maximum: 1, description: "Probability that origin_country is right, from a calibration map fitted on the development set only (D160). Present only for the general engine (engine-v1) answered by the primary model; absent for the fallback model and the textile, Part 102 and pharmaceutical engines. With CALIBRATION=on (the default) the auto-accept bar is applied to this value (CALIBRATED_FAST_PATH, default 0.90)." }
        calibration: { type: string, description: "Version of the calibration map behind calibrated_confidence, e.g. cal-v2" }
        reasoning: { type: string }
        cited_rulings: { type: array, items: { type: string }, description: Earlier rulings the model named (only rulings it was shown) }
        precedents: { type: array, items: { type: string }, description: All earlier rulings shown to the model }
    Triage:
      type: object
      properties:
        route: { type: string, enum: [auto, needs_review, needs_info], description: "needs_info: no earlier ruling on point; answer clarify.questions via /answers" }
        reason:
          type: string
          description: 'Starts with "out of scope: " for regimes the tool does not cover (textile_102_21 unless the textile engine is on; usmca_part102 unless the USMCA engine is on; pharma_api unless the pharma engine is on), with "textile rules (19 CFR 102.21)" when the textile engine predicted the case (prediction.trace.prompt_version textile-v1, D51), with "USMCA / Part 102 rules (19 CFR 102.11)" when the USMCA engine predicted it (prompt_version usmca-v5 since D602, usmca-v1 before; USMCA_ENGINE=on, off by default; D61), or with "pharmaceutical rules (active ingredient)" when the pharma engine predicted it (prompt_version pharma-v1, PHARMA_ENGINE=on, off by default; D62). When prediction.calibrated_confidence is present (CALIBRATION=on, the default; D160) the confidence clause is "calibrated confidence <c> ≥ <bar> (<map>; model stated <s>)" or "... below <bar> ...". With FAST_PATH_BY_FAMILY=on (off by default, D63) the stated confidence and the family bars are used instead, and the confidence clause names the bar used, e.g. "(electronics family bar)" or "(global bar; no medical family bar)". When prediction.trace.model_id is the fallback engine rather than the primary, the reason is "answered by the fallback model (<id>) because the primary engine was unavailable" and the route is needs_review unless FALLBACK_FAST_PATH is set (D56).'
    RouterLabel:
      type: object
      properties:
        route: { type: string }
        subfamily: { type: string }
        regime: { type: string, enum: [substantial_transformation, textile_102_21, usmca_part102, pharma_api, unclear] }
        reason: { type: string }
        rule: { type: string, enum: [usmca-named, no-part102-cue], description: 'Present when a deterministic check after the model changed the regime (router-v4, D232): usmca-named (the facts name USMCA or NAFTA, so usmca_part102) or no-part102-cue (a usmca_part102 label on facts with no classification, marking, trade-program or USMCA wording, so substantial_transformation).' }
    CaseResponse:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            id: { type: string }
            date: { type: string, format: date }
            facts: { type: string, description: The facts the engine read (rendered from the product when one was given) }
            product: { $ref: "#/components/schemas/Product" }
            family: { type: string }
            exclude_rulings: { type: array, items: { type: string }, description: "Rulings the engine and the plan search never read for this case (as given at prediction)" }
            jurisdiction: { $ref: "#/components/schemas/JurisdictionCode" }
            jurisdiction_detail: { $ref: "#/components/schemas/JurisdictionDetail" }
            japan: { $ref: "#/components/schemas/JapanInput" }
            prediction: { description: "Empty (origin_country \"\") when jurisdiction_detail.supported is false: no engine ran (D680)", allOf: [{ $ref: "#/components/schemas/Prediction" }] }
            triage: { $ref: "#/components/schemas/Triage" }
            router: { $ref: "#/components/schemas/RouterLabel" }
            plan: { $ref: "#/components/schemas/PlanResult" }
            clarify: { $ref: "#/components/schemas/Clarify" }
            answers: { type: array, items: { type: object, properties: { question: { type: string }, answer: { type: string } } } }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            step: { type: string, enum: [product, origin, plan, export] }
            pinned: { type: boolean }
            broker_reviews: { type: array, items: { $ref: "#/components/schemas/BrokerReview" }, description: "The case's broker review links, newest first (D200). Present only when the case has at least one; never on a pinned demo for non-admin callers." }
            can_write: { type: boolean, description: "Whether the caller may change this case (#283). Computed by the server for each request with the same authorization the write routes use; hidden cases are never returned, and the value is never stored or taken from the client. Pinned demos are false for non-admin callers, but that means no persisted change only: Ask, scenarios and plan previews on a pinned demo stay read-only and allowed. The server still enforces every action (403 forbidden)." }
            display_name: { type: string }
            precedents_detail:
              type: array
              description: The earlier rulings in prediction.precedents, in the same order, with CBP's held origin
              items: { $ref: "#/components/schemas/PrecedentRef" }
            cited_detail:
              type: array
              description: Rulings cited in the conversation, first mention first, with CBP's held origin
              items: { $ref: "#/components/schemas/PrecedentRef" }
            chat:
              type: array
              description: Conversation with the case agent, oldest first (last 20). Each turn keeps its what-ifs and steps.
              items: { $ref: "#/components/schemas/ChatTurn" }
            scenarios:
              type: array
              items:
                type: object
                properties:
                  label: { type: string }
                  facts: { type: string }
                  product: { $ref: "#/components/schemas/Product" }
                  prediction: { $ref: "#/components/schemas/Prediction" }
                  triage: { $ref: "#/components/schemas/Triage" }
                  precedents_detail: { type: array, items: { $ref: "#/components/schemas/PrecedentRef" } }
                  comparison: { $ref: "#/components/schemas/Comparison" }
                  plan_check:
                    type: object
                    description: "The latest plan search's row for the same move (the same groups to the same plants), so a scenario and a plan never give two verdicts on one move (D220). Present only when the scenario moves something and the plan search tried that move. The scenario's own triage is the engine's origin answer, not a plan approval."
                    properties:
                      shown: { type: boolean, description: "true when the plan search shows this move as a precedent-supported plan" }
                      confidence: { type: number, nullable: true, description: "the precedent check's confidence; null when the move was not checked" }
                      bar: { type: number, description: "the precedent-check bar (0.92)" }
                      supporting_ruling: { type: string }
                      rejection_kind: { type: string, description: "why the plan search did not show it (below_confidence_bar, no_supporting_precedent, ...)" }
                      rejection_reason: { type: string, description: "the plan row's reason, word for word" }
                      description: { type: string }
                      net_per_year: { type: number }
                      target: { type: string }
            facts_source: { type: string, enum: [parts_list, pasted], description: "What the case's own prediction read (D220): parts_list when its facts are the structured product rendered with the family template, as scenarios and plan moves are; pasted when they are text the user gave, such as CBP's own facts. The two can give different answers for the same setup. Absent without a product." }
            rule_check: { $ref: "#/components/schemas/RuleCheck" }
            ruling_alerts: { $ref: "#/components/schemas/RulingAlerts" }
            economics: { description: "latest economics given for the case, if any", allOf: [{ $ref: "#/components/schemas/Economics" }] }
            plan_economics_stale: { type: boolean, enum: [true], description: "Present, and true, only when the stored plan was priced from economics that have since changed: do not present its money as current; a missing flag means not stale" }
            targets_economics_stale: { type: boolean, enum: [true], description: "Present, and true, only when a stored target comparison was priced from economics that have since changed; a missing flag means not stale" }
            economics_priced: { description: "economics with the sourced duty rates a plan search would use filled in (D52, D56), plus live MFN rates already fetched (D65; viewing a case never waits on the HTS); null without economics. Display only.", allOf: [{ $ref: "#/components/schemas/Economics" }] }
            history:
              type: array
              description: Audit trail, oldest first (last 200)
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  kind: { type: string, enum: [predicted, answered, plan_searched, scenarios, targets_compared, watched, asked, exported, economics, pinned, unpinned, renamed, bom_updated, review_link_created, review_link_revoked, broker_decision] }
                  summary: { type: string }
                  llm_provider: { type: string }
                  model_id: { type: string }
                  prompt_version: { type: string }
                  input_tokens: { type: integer, description: Summed over every model call in the step; absent when no model was called }
                  output_tokens: { type: integer }
                  cost_usd: { type: number, description: "Estimated at the eval's promo prices (eval/RESULTS.md); cached precedent checks cost nothing. For asked, the agent model only (not its what-if engine calls)." }
                  latency_ms: { type: integer, description: Wall time of the step }
                  actor: { type: string, format: email, description: "The signed-in user who took the step (TEAMS=on, D68); absent for anonymous visitors" }
            watch:
              oneOf:
                - { $ref: "#/components/schemas/Watch" }
                - { type: "null" }
              description: null until re-checked
    Watch:
      type: object
      description: |
        The latest re-check. status is only the origin comparison. basis says whether a difference can be read as a ruling change: only basis=precedent means "the precedents moved". A watch saved before basis existed has no basis; read that as unknown, not as confirmed, and not as changed or unchanged: the next POST /watch replaces it.
      properties:
        checked_at: { type: string, format: date-time }
        status: { type: string, enum: [unchanged, changed] }
        prediction: { $ref: "#/components/schemas/Prediction" }
        newer_rulings: { type: array, description: "precedents used that are dated after the case date", items: { $ref: "#/components/schemas/PrecedentRef" } }
        precedents_detail: { type: array, items: { $ref: "#/components/schemas/PrecedentRef" } }
        basis:
          type: string
          enum: [precedent, regime, method, specialist_unavailable, unverified]
          description: "precedent: same regime and method, so a change is the rulings. regime: a different regime's engine answered. method: same regime, different engine prompt version. specialist_unavailable: the case's specialist engine failed and a provisional general answer was given. unverified: no stored scope label, or the stored prediction names no known engine, so it cannot be compared."
        regime: { type: string, description: "Regime whose engine produced watch.prediction (substantial_transformation, textile_102_21, usmca_part102, pharma_api)" }
        original_regime: { type: string, description: "Regime of the case's own prediction, from its trace; absent when unknown (never taken from the router label)" }
        scope:
          type: string
          enum: [no_router, configured_failed, confirmed, label_missing]
          description: What is known about the regime; label_missing means the case has no stored router label
        specialist:
          type: string
          enum: [ok, failed, unconfigured]
          description: Outcome of the selected specialist engine; absent when no specialist regime was selected
        triage: { $ref: "#/components/schemas/Triage", description: "Verdict for the watch result (the same policy as the case triage; needs_review for unverified and specialist_unavailable)" }
    Clarify:
      type: object
      description: Only for in-scope cases below the fast-path bar (0.92). Never changes the predicted origin.
      properties:
        on_point: { type: boolean, description: An earlier ruling on the same kind of product and question exists }
        closest_ruling: { type: string }
        on_point_reason: { type: string }
        conflict:
          type: object
          description: Two comparable earlier rulings that went different ways, and the difference CBP relied on
          properties:
            ruling_a: { type: string }
            holding_a: { type: string }
            ruling_b: { type: string }
            holding_b: { type: string }
            deciding_difference: { type: string }
            leans:
              type: [string, "null"]
              enum: [a, b, null]
              description: Which of the two rulings this case's facts are closer to on the deciding difference; null when the facts do not say (clarify-v2). The UI marks that ruling, or nothing when null.
        questions: { type: array, maxItems: 3, items: { type: string } }
    LiveMFN:
      type: object
      description: >-
        The column 1 general (MFN) rate of one subheading, fetched live from the USITC HTS and cached (D65). Only plain
        ad valorem rates ("4.2%", "Free") get a rate; specific or compound rates are reported as printed with
        supported false. Never includes Section 301, forced-labor or 232 duties, or special (FTA/GSP) rates.
      properties:
        hts: { type: string, example: "8516.79.00" }
        description: { type: string }
        general: { type: string, example: "2.7%", description: "the rate as printed in the HTS" }
        rate: { type: [number, "null"], example: 0.027, description: "ad valorem fraction; null unless supported" }
        supported: { type: boolean }
        mfn_only: { type: boolean, description: "always true: additional duties not included" }
        live: { type: boolean, description: "always true: not from the researched table" }
        source: { type: string, example: "https://hts.usitc.gov/reststop/search?keyword=8516.79.00" }
        fetched_at: { type: string, format: date-time }
        note: { type: string, description: "says that additional duties (Section 301, forced-labor, 232) are not included, and why there is no rate when unsupported" }
    Economics:
      type: object
      description: User inputs, illustrative — editable. Kept on the case and reused to price scenarios.
      properties:
        illustrative: { type: boolean }
        annual_import_value_usd: { type: number }
        duty_rates: { type: object, additionalProperties: { type: number }, description: "Total ad-valorem rate by origin, 0.25 = 25%" }
        duty_rates_note: { type: string }
        duty_rates_from_table: { type: array, items: { type: string }, description: "Response only: origins whose rate came from the sourced duty table (product.hts set; the user's rates win; D52)" }
        duty_rates_live_mfn: { type: array, items: { type: string }, description: "Response only: origins whose rate is the live HTS MFN rate (DUTY_LIVE_MFN=on, subheading not in the table; the user's rates win; never column 2 or US origins). With the Section 301 table (D90), each origin's China Section 301 list duty and 2026 country-wide Section 301 duty are added to the MFN rate (see duty_additional); Section 232 duties are not included (D65, D90)" }
        duty_additional:
          type: object
          description: |
            Response only (D90): per origin, the HTS Chapter 99 duties added to its live MFN rate. These come from China's Section 301
            lists (U.S. note 20: 9903.88.01/.02/.03/.04 at 25%, .15 at 7.5%), less whole-subheading exclusions, and from the 2026 country-wide
            Section 301 duties (9903.05.20–.84, 91 FR 47318) less the U.S. note 52 exemptions that cover a whole subheading. Exclusions for
            described products, and exemptions tied to a use or an entry claim, are not applied; duty_rates_note names them to check.
            An exclusion is judged at one current UTC instant per pricing request, valid through its stored end date (a whole UTC day, D109); after it, duty_rates_note calls it historical and not applicable as of that date per the embedded end date, with no statement about later extensions, and an unreadable end date asks the user to confirm. Plan search, scenarios, compare-targets and money-prefill use the same instant for every origin.
          additionalProperties:
            type: array
            items: { type: object, properties: { name: { type: string }, heading: { type: string }, rate: { type: number } } }
        group_costs: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } }, description: "group -> plant id -> yearly USD" }
        operations: { $ref: "#/components/schemas/EconomicsOperations" }
    EconomicsOperations:
      type: object
      description: "Optional operational inputs (#281), all user-entered; an explicit 0 is a known zero and an absent or null field is not entered. An empty block, a note-only block and entries with only a ref or sources are inactive and are not stored. Unknown JSON fields are rejected."
      properties:
        horizon_years: { type: number, description: "Positive; required whenever a one-time cost applies. One-time costs are amortized straight-line over it (no discounting, residual value or tax)." }
        max_lead_time_days: { type: integer, description: "Your lead-time limit; lead times of moved groups are assumed to run in parallel" }
        note: { type: string, description: "Free text; changes no result and no hash" }
        groups:
          type: object
          additionalProperties: { $ref: "#/components/schemas/EconomicsOpsGroup" }
    EconomicsOpsGroup:
      type: object
      properties:
        cost_basis: { type: string, enum: [included, additional], description: "Whether labour and logistics are already inside the group cost (included) or are added to it (additional); required where labour or logistics is entered, to prevent double counting" }
        unit: { type: string, description: "Unit label for demand and MOQ; case-sensitive" }
        annual_demand_units: { type: number }
        orders_per_year: { type: number }
        plants:
          type: object
          additionalProperties: { $ref: "#/components/schemas/EconomicsOpsPlant" }
    EconomicsOpsPlant:
      type: object
      properties:
        ref:
          type: object
          required: [name, country]
          description: "The plant this entry was entered for; an entry whose product plant now has another name or country is treated as not entered (stale). The expected name is the plant's name with surrounding spaces trimmed, or the plant's id when it has no name (an unnamed plant is identified by its id). Names compare after space and case folding and countries after normalisation. Two plants with the same name and country at different times are the same plant for this check; it is not a unique-identity guarantee."
          properties: { name: { type: string, minLength: 1, description: "The plant's trimmed name, or its id when the plant has no name" }, country: { type: string } }
        labour_usd_per_year: { type: number }
        logistics_usd_per_year: { type: number }
        capex_usd: { type: number }
        retooling_usd: { type: number }
        lead_time_days: { type: integer }
        moq_units: { type: number }
        moq_unit: { type: string }
        sources: { type: object, additionalProperties: { type: string }, description: "Provenance notes by factor; metadata only, never echoed in results" }
    PlanOperations:
      type: object
      description: "The operational view of one move, from one shared calculation (plan search, compare, scenarios and target comparison give the same object for the same inputs and move). A priced net covers the modelled terms only."
      required: [components, net_modelled_per_year, priced, unknown, not_modelled, sunk_ignored, stale_refs, checks, feasibility_assessed, assumptions, baseline, proposed]
      properties:
        components:
          type: object
          description: "Each term is a number, or null when unknown or not modelled; never a zero"
          required: [duty_effect_per_year, group_cost_delta_per_year, labour_delta_per_year, logistics_delta_per_year, operating_delta_per_year, one_time_total_usd, amortized_one_time_per_year]
          properties:
            duty_effect_per_year: { type: [number, "null"] }
            group_cost_delta_per_year: { type: [number, "null"] }
            labour_delta_per_year: { type: [number, "null"] }
            logistics_delta_per_year: { type: [number, "null"] }
            operating_delta_per_year: { type: [number, "null"] }
            one_time_total_usd: { type: [number, "null"] }
            amortized_one_time_per_year: { type: [number, "null"] }
        net_modelled_per_year: { type: [number, "null"], description: "Equals the plan's net_per_year exactly when priced and net_priced are true" }
        priced: { type: boolean, description: "No financial input was unknown" }
        horizon_years: { type: number }
        feasibility_assessed: { type: boolean }
        feasibility: { type: string, enum: [feasible, infeasible, unknown], description: "Omitted when feasibility_assessed is false" }
        decision: { type: string, enum: [operationally_infeasible, net_costlier], description: "Omitted when the move was not demoted by cost" }
        unknown:
          type: array
          items:
            type: object
            required: [category, factor, reason]
            properties:
              category: { type: string, enum: [financial, feasibility] }
              factor: { type: string }
              group: { type: string }
              reason: { type: string }
        not_modelled: { type: array, items: { type: string }, description: "Factors in neither side of the comparison; show beside any priced figure, even when priced is true" }
        sunk_ignored:
          type: array
          items: { type: object, required: [group, plant, factor], properties: { group: { type: string }, plant: { type: string }, factor: { type: string } } }
        stale_refs:
          type: array
          items: { type: object, required: [group, plant, factor], properties: { group: { type: string }, plant: { type: string }, factor: { type: string } } }
        checks:
          type: array
          items:
            type: object
            required: [kind, status]
            properties:
              kind: { type: string, enum: [lead_time, moq] }
              group: { type: string }
              status: { type: string, enum: [feasible, infeasible, unknown] }
              value: { type: number }
              limit: { type: number }
              unit: { type: string }
              reason: { type: string }
        assumptions: { type: array, items: { type: string } }
        baseline:
          type: object
          required: [duty_usd, operating_usd, total_usd]
          description: "Absolute yearly figures for the current setup; null unless computable (totals null unless priced)"
          properties:
            duty_usd: { type: [number, "null"] }
            operating_usd: { type: [number, "null"] }
            total_usd: { type: [number, "null"] }
        proposed:
          type: object
          required: [duty_usd, operating_usd, total_usd]
          properties:
            duty_usd: { type: [number, "null"] }
            operating_usd: { type: [number, "null"] }
            amortized_one_time_usd: { type: number, description: "Omitted when not applicable or unknown (the server never sends null)" }
            total_usd: { type: [number, "null"] }
    PlanObjective:
      type: object
      description: "Present only in operations mode: what 'best' means here"
      required: [mode, scope, statement]
      properties:
        mode: { type: string, example: operations_v1 }
        scope: { type: string, example: searched_moves_only }
        statement: { type: string }
    DemoRecordedRun:
      type: object
      description: >-
        A development run of a demo kept in a committed result file (D191), shown beside CBP's holding before the demo is run on this
        site. It is not a run on this site. Present only on demos that have one.
      required: [run, file, engine_origin, stated_confidence, calibrated_confidence, calibration, cbp_origin, agrees_with_cbp]
      properties:
        run: { type: string, description: How and when it ran (model, gateway, plan bar) }
        file: { type: string, example: eval/results/planner-families-n349871-litellm.json }
        engine_origin: { type: string, example: Thailand }
        stated_confidence: { type: number }
        calibrated_confidence: { type: number, description: The stated confidence through the calibration map (D160) }
        calibration: { type: string, example: cal-v2 }
        cbp_origin: { type: string, example: China }
        agrees_with_cbp: { type: boolean }
        best_plan: { type: string, description: "The first plan shown at the bar, if any, as the result file records it" }
        best_plan_move: { type: array, items: { type: object, properties: { group: { type: string }, to_plant: { type: string } } }, description: "That plan's move, from the result file" }
        best_plan_words: { type: string, description: "The move in the product's own words (D220), e.g. Move the lid and firebox forming, the burners and gas train and the cooking surface, panels and frame to Indonesia" }
        best_plan_includes: { type: array, items: { type: string }, description: "The parts and steps of the demo's product that the move takes with it (D220)" }
        plan_check: { type: number }
        plan_ruling: { type: string }
    PlanRequest:
      type: object
      required: [target]
      properties:
        target: { type: string, example: Thailand }
        jurisdiction: { description: "Optional. When given it must be the case's market, else 400. A case whose market has no engine, or a non-U.S. case, is refused with 400: plan search is a U.S. CBP search (D680).", allOf: [{ $ref: "#/components/schemas/JurisdictionCode" }] }
        economics: { $ref: "#/components/schemas/Economics" }
        actual_change:
          type: object
          description: For backtests, the real change and CBP's ruling on it; the result compares it with the best plan.
          properties:
            _source: { type: string }
            moved_to: { type: string }
            moved_to_thailand: { type: array, items: { type: string } }
            still_from_china: { type: array, items: { type: string } }
    Verdict:
      type: object
      properties:
        precedent_supported: { type: boolean }
        supporting_ruling: { type: string }
        counter_ruling: { type: string }
        confidence: { type: number }
        reasoning: { type: string }
        agreement: { type: string, description: "When the check ran several times, how many runs gave this answer, e.g. 2/3." }
        trail:
          type: array
          description: |
            The precedent check's search path, in order (D80): each search with the ruling numbers it returned,
            and each ruling read. Verdicts cached before D80 have none.
          items:
            type: object
            properties:
              tool: { type: string, enum: [search, read] }
              query: { type: string, description: "The search text, or the ruling number asked for." }
              rulings: { type: array, items: { type: string }, description: "Rulings a search returned, or the ruling read (empty if not found)." }
    Plan:
      type: object
      properties:
        move:
          type: array
          description: |
            The operation groups moved, 1 to 4. The search lists every single and pair, then three-group moves while the
            total stays at most PLAN_MAX_MOVES (default 12; D84). A move followed from near-miss advice can add one more group (D85).
          items: { type: object, properties: { group: { type: string }, to_plant: { type: string } } }
        description: { type: string }
        prediction: { $ref: "#/components/schemas/Prediction" }
        verdict: { $ref: "#/components/schemas/Verdict" }
        duty_effect_per_year: { type: number }
        added_cost_per_year: { type: number }
        net_per_year: { type: number }
        net_priced:
          type: boolean
          description: |
            Whether the search could vouch for this plan's three yearly figures. True: an annual import value, a duty
            rate for both the current and the plan's origin and, when any group costs were entered, a cost at both
            plants of every moved group, so the figures are real even when 0 (with no group costs at all the supported
            no-cost mode prices the duty side alone). False: the search ran and could not, so a 0 is unknown and any
            nonzero figure rests on blanks read as 0. Absent: the plan was stored before this field, so its pricing
            can't be proven either way.
        operations: { $ref: "#/components/schemas/PlanOperations" }
        shown: { type: boolean }
        rejection_reason: { type: string }
        rejection_kind:
          type: string
          enum: [current_setup, below_confidence_bar, no_supporting_precedent, engine_other_origin, check_failed, operationally_infeasible, net_costlier]
          description: |
            Why a plan is not shown. `operationally_infeasible` and `net_costlier` (operations mode only) demote a plan the legal and precedent gate had shown; the reason names the modelled terms only. `below_confidence_bar` = precedent-supported, verifier confidence below the plan bar (0.92):
            render as a greyed "Precedent-supported — below confidence bar" row with its supporting ruling.
        near_miss:
          type: object
          description: |
            Only with NEAR_MISS_ADVICE=on (D81), on at most two `below_confidence_bar` moves per search whose check is at least 0.85:
            what differs between this move and its supporting ruling on the point CBP relied on, and what change to the setup
            would match the ruling. One extra model call each, cached. Advice only: it never changes the verdict, the bar or `shown`.
          properties:
            difference: { type: string, example: "In N325810 the PCBA was also made in Thailand; in your setup it stays in China." }
            would_match: { type: string, example: "Make the PCBA in Thailand as well." }
            ruling: { type: string, description: "The supporting ruling compared (the verdict's supporting_ruling)" }
            trace: { type: object, description: "Model, prompt_version near-miss-v1, tokens; cached true when replayed" }
        from_advice:
          type: boolean
          description: |
            Only with FOLLOW_ADVICE=on (D85): true on the one move per search added by following a near miss's advice. It is the
            advised move plus the groups its would_match names, searched because no earlier move covered it, and checked once like
            any other move (engine, then precedent check). It may be shown, below the bar or rejected. Absent otherwise.
        tier:
          type: string
          enum: [clear_margin, at_bar]
          description: |
            Shown plans only (D341): clear_margin when the precedent check is at least ranking.clear_from and names no
            counter-ruling; at_bar otherwise (borderline, may not hold on re-check). Shown plans sort by tier, then net.
            Absent on rejected moves and on plans stored before D341.
        parts_moved: { type: integer, description: "Shown plans only: how many components the move changes the country of" }
        smallest_supported:
          type: boolean
          description: True on the shown plan that moves the fewest parts when two or more are shown (D340). A label, not a sort key.
        rule_check: { $ref: "#/components/schemas/PlanRuleCheck" }
        plan_id:
          type: string
          description: |
            The plan's stable identifier, its move key: each moved group and its plant, group@plant, joined by "+" in move
            order (D470). Pass it as plan_id (or move_key) to exportCase or createBrokerReviewLink. Added when the plan is
            returned or read, never stored. Absent on the baseline (no move).

    PlanRuleCheck:
      type: object
      description: |
        The 19 CFR 102.20 rule check of the product as it would be after this move (D441): the moved parts take the
        target plant's country, and the good is produced where its final-assembly group would be. Present on every plan
        (and the baseline) of a Part 102 case, and of a substantial-transformation case only when the good and every part
        have an HTS code. Added when the plan is returned or read, never stored. It never changes the verdict, the tier
        or which plans are shown. On a Part 102 case it orders shown plans within each tier (D500): status shifts
        first, then undetermined, then no_shift or other_country; on a substantial-transformation case it is display
        only. RULE_CHECK=off removes it (and the D500 order).
      required: [applies, country, status, label, reason, review]
      properties:
        applies: { type: string, enum: [part102, informational] }
        country: { type: string, description: "Where the good would be produced after the move; empty when not known" }
        status:
          type: string
          enum: [shifts, no_shift, other_country, undetermined]
          description: "shifts: the rule gives the target. no_shift: it gives another country because a foreign part fails the change. other_country: it gives another country although no part fails (the good is still finished there). undetermined: see why."
        label: { type: string, description: "The status in a few words, e.g. \"Shifts under 102.20 (8543.70)\" or \"Undetermined (no code for 2 parts)\"" }
        origin: { type: string }
        basis: { type: string }
        rule: { type: string, example: "19 CFR 102.20(o), 8543.70" }
        reason: { type: string }
        why:
          type: string
          enum: [out_of_scope, good_code, no_country, missing_code, needs_fact, de_minimis, essential, chapter_note, no_origin, no_materials, other]
        failing: { type: array, items: { type: string }, description: "Foreign parts that do not make the change" }
        agrees_with_precedent: { type: boolean, description: "Present when the rule decided and the move has a precedent check" }
        review:
          type: boolean
          description: "True when an earlier ruling supports the move but the rule gives another country, or (Part 102 cases) the rule gives the target but no ruling supports the move. Worth a broker's look; changes nothing"
        review_note: { type: string }

    Range:
      type: object
      properties:
        min: { type: number }
        max: { type: number }
    PlanEstimate:
      type: object
      properties:
        target: { type: string }
        moves: { type: integer, description: "Moves the search would make." }
        engine_calls: { type: integer, description: "Engine predictions: the current setup plus one per move." }
        engine_cached: { type: integer, description: "Of engine_calls, how many are already stored (cost nothing)." }
        checks_cached: { type: integer, description: "Moves with a stored prediction reaching the target and a stored verdict." }
        checks_skipped: { type: integer, description: "Moves with a stored prediction that misses the target (no check runs)." }
        checks_fresh: { $ref: "#/components/schemas/Range", description: "Precedent checks that may run." }
        near_miss_calls: { $ref: "#/components/schemas/Range" }
        model_calls: { $ref: "#/components/schemas/Range" }
        cost_usd: { $ref: "#/components/schemas/Range", description: "Model cost at promo prices." }
        wall_seconds: { $ref: "#/components/schemas/Range" }
        panel: { type: boolean }
        near_miss: { type: boolean }
        max_in_flight: { type: integer }
        note: { type: string }
    PlanResult:
      type: object
      properties:
        target: { type: string }
        current_origin: { type: object, properties: { country: { type: string }, ruling: { type: string } } }
        baseline: { $ref: "#/components/schemas/Plan" }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" }, description: "Precedent-supported, verifier confidence >= 0.92 (PLAN_CONFIDENCE). Ranked by tier (clear margin first, then at the bar; D341), then net a year, best first. On a Part 102 case, within each tier, by rule_check first (D500: shifts, then undetermined, then another country)" }
        rejected: { type: array, items: { $ref: "#/components/schemas/Plan" }, description: "Greyed rows, closest first: current setup, below_confidence_bar, no_supporting_precedent, engine_other_origin" }
        backtest: { type: object }
        stats: { type: object, description: "Full-plan cost: engine calls, verifier model and tool calls, tokens, wall seconds" }
        economics_illustrative: { type: boolean }
        duty_rates_note: { type: string }
        objective: { $ref: "#/components/schemas/PlanObjective" }
        economics_basis: { type: string, description: "Operations mode only: SHA-256 of the canonical raw money inputs this result was priced from (before table or live rates are filled in). A later edit of a cost, rate, constraint or the annual value changes it; note and sources do not." }
        ranking:
          type: object
          description: How shown plans were ordered (D341; on a Part 102 case read with the rule check, D500). Absent on results stored before D341, which were ranked by net alone.
          properties:
            rule: { type: string, enum: [tier_then_net, tier_then_rule_then_net] }
            bar: { type: number, example: 0.92 }
            clear_from: { type: number, example: 0.93, description: "Lowest check in the clear-margin tier: the bar plus the clear margin" }
    PlanResponse:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            case_id: { type: string }
            jurisdiction: { $ref: "#/components/schemas/JurisdictionCode" }
            plan: { $ref: "#/components/schemas/PlanResult" }
    BrokerReviewDecision:
      type: object
      required: [decision, at]
      properties:
        decision: { type: string, enum: [approve, changes, file_request] }
        comment: { type: string, description: Plain text from the broker. Render as text, never as HTML or Markdown. }
        at: { type: string, format: date-time }
    BrokerReview:
      type: object
      description: A broker review link as its case owner sees it (D200). Never carries the token, its hash or the draft text.
      required: [id, status, subject, draft_label, format, created_at, expires_at, decisions]
      properties:
        id: { type: string, pattern: "^rv_[0-9a-f]{16}$" }
        status: { type: string, enum: [pending, viewed, approved, changes_requested, file_requested, revoked, expired], description: "revoked and expired win; otherwise the latest answer; else viewed or pending." }
        subject: { type: string, enum: [setup, plan] }
        draft_label: { type: string, description: "Current setup, or the plan's description" }
        format: { type: string, enum: [markdown, cfr177] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        first_viewed_at: { type: string, format: date-time }
        decisions: { type: array, items: { $ref: "#/components/schemas/BrokerReviewDecision" }, description: Oldest first }
        changed_since_shared:
          type: integer
          minimum: 1
          description: "Count of final CBP changes, in effect now and dated on or after the day the link was shared, to the rulings the frozen draft cites or its plan rests on (#714). Derived on every read and never stored; present only when at least one, for every link that is not revoked (expired and approved ones included, whatever the broker can still open). Dates are date-only, so a change on the sharing day (UTC calendar date) counts. The current setup's ruling is not in the snapshot, so it is not covered. It says what CBP changed, not that an approval is invalid."
    BrokerReviewForBroker:
      type: object
      required: [id, status, subject, draft_label, created_at, expires_at, decisions]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, viewed, approved, changes_requested, file_requested] }
        subject: { type: string, enum: [setup, plan] }
        draft_label: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decisions: { type: array, items: { $ref: "#/components/schemas/BrokerReviewDecision" } }
    BrokerReviewPacket:
      type: object
      description: What the broker reads, frozen when the link was made (D200).
      required: [review, product_name, prediction, cited_rulings, draft, shared_at, disclaimer]
      properties:
        review: { $ref: "#/components/schemas/BrokerReviewForBroker" }
        product_name: { type: string }
        product: { oneOf: [{ $ref: "#/components/schemas/Product" }, { type: "null" }], description: "The product as drafted (after the move, for a plan)." }
        prediction:
          type: object
          description: The prediction behind the requested position (the plan's, for a plan).
          properties:
            origin_country: { type: string }
            confidence: { type: number, description: The model's stated confidence. }
            calibrated_confidence: { type: [number, "null"], description: "The calibrated probability when a map applies (D160); null otherwise." }
            decisive_step: { type: string }
            key_factors: { type: array, items: { type: string } }
        cited_rulings: { type: array, items: { $ref: "#/components/schemas/PrecedentRef" } }
        plan:
          oneOf:
            - type: "null"
            - type: object
              properties:
                description: { type: string }
                predicted_origin: { type: string }
                supporting_ruling: { type: string }
                counter_ruling: { type: string }
                check_confidence: { type: number }
                below_bar: { type: boolean }
        draft:
          type: object
          properties:
            format: { type: string, enum: [markdown, cfr177] }
            content: { type: string, description: The letter (Markdown). }
            notes: { type: array, items: { type: string } }
        ruling_changes:
          type: array
          description: "Final CBP changes, in effect now and dated on or after the day the link was shared (UTC calendar date, same day included: dates are date-only), to the rulings the frozen draft cites or its plan rests on (#714). Derived on each read from the frozen snapshot only, never from the live case, and nothing is stored. The current setup's ruling is not a structured field in the snapshot, so it is not covered. Proposed, scheduled and earlier changes are not listed. Present only when there is at least one; says what CBP changed, not that an approval is invalid. No case id or owner data."
          items:
            type: object
            required: [ruling, roles, status, kind, by, note]
            properties:
              ruling: { type: string }
              roles: { type: array, items: { type: string, enum: [cited, plan_support] } }
              status: { type: string, enum: [final] }
              kind: { type: string, enum: [revoked, modified] }
              by: { type: string }
              date: { type: string, format: date }
              in_effect: { type: boolean }
              bulletin: { type: string }
              url: { type: string }
              note: { type: string, description: "The change in words, e.g. modified by H344999 on 2026-05-06" }
              held_before: { type: string }
              held_after: { type: string }
              answer: { type: string, description: "The frozen draft's origin" }
              relevance: { type: string, enum: [touches_answer, not_answer, holding_unchanged, unknown] }
              relevance_note: { type: string }
              relevance_role: { type: string, enum: [cited, plan_support] }
        shared_at: { type: string, format: date-time }
        disclaimer: { type: string }
    ExportResponse:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            case_id: { type: string }
            format: { type: string, enum: [markdown, cfr177], description: The format rendered; content is Markdown text in both. }
            content: { type: string, description: "The letter only: what would be filed. No reviewer notes or disclaimer." }
            notes:
              type: array
              items: { type: string }
              description: "Shown beside the letter, never in it, its print or its download: the draft-for-review disclaimer, how the 177.2 letter marks gaps, and a move under the confidence bar (18 Oct), and a final, in-effect CBP change to a ruling the draft relies on, with whether it bears on the answer (#714)."
    Ruling:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        subject: { type: string }
        text: { type: string }
        url: { type: string, example: https://rulings.cbp.gov/ruling/N357771 }
        origin: { type: [string, "null"], description: "CBP's held origin; null when the ruling has no single held origin" }
        superseded: { $ref: "#/components/schemas/Superseded" }
        proposed: { $ref: "#/components/schemas/ProposedChange" }
    Superseded:
      type: object
      description: "Present only when a later CBP ruling in the corpus, or a final notice in a fetched Customs Bulletin, revoked or modified this one (D320, D400). On GET /v1/rulings it is as of `before` (any known one without it); on GET /v1/rulings/{id} it is any known one. Precedent checks never cite such a ruling for a case dated after `date` (D370)."
      required: [by, kind, date, note]
      properties:
        by: { type: string, example: H325607 }
        kind: { type: string, enum: [revoked, modified] }
        date: { type: string, format: date, description: "Issue date of the superseding ruling; for a change read only from a Customs Bulletin notice, the notice's effective date" }
        note: { type: string, example: "revoked by H325607 on 2025-08-29" }
        bulletin: { type: string, description: "The Customs Bulletin notice that published or confirmed the change (D400)", example: "Customs Bulletin vol. 59 no. 38, p. 1" }
        bulletin_url: { type: string, description: "The bulletin's PDF on cbp.gov" }
    ProposedChange:
      type: object
      description: "Present only when CBP proposed to revoke or modify this ruling in a fetched Customs Bulletin notice and no fetched notice made it final (D400). Information only: it never bars the ruling as a precedent."
      required: [by, kind, bulletin, bulletin_url, note]
      properties:
        by: { type: string, description: "The proposed ruling attached to the notice", example: H341085 }
        kind: { type: string, enum: [revoked, modified] }
        bulletin: { type: string, example: "Customs Bulletin vol. 58 no. 44, p. 1" }
        bulletin_url: { type: string }
        note: { type: string, example: "CBP proposed to revoke it (H341085, Customs Bulletin vol. 58 no. 44, p. 1)" }
    Comparison:
      type: object
      description: Yearly money view of a scenario against the current setup (current origin = CBP's known holding if given, else the case prediction). Illustrative unless the economics are sourced.
      properties:
        duty_rate: { type: [number, "null"], description: rate for the scenario's predicted origin }
        annual_duty_usd: { type: [number, "null"], description: "In operations mode null (never 0) when the annual import value is not above 0, because an unknown dollar figure is not a zero; a known rate with a positive annual value is a real figure, including 0" }
        duty_savings_usd: { type: [number, "null"], description: "current setup's duty minus this scenario's. In operations mode null when the annual import value is not above 0 or the duty effect is unknown (see operations.components.duty_effect_per_year); the feasibility and the known rates are still returned" }
        added_cost_usd: { type: [number, "null"], description: "yearly cost of the operation groups moved (product scenarios with group costs only)" }
        net_usd: { type: [number, "null"], description: savings minus added cost }
        moved: { type: array, items: { type: object, properties: { group: { type: string }, to_plant: { type: string } } } }
        illustrative: { type: boolean }
        amortized_one_time_usd: { type: number, description: "Operations mode: one-time costs amortized per year. The server omits the key (it never sends null) when the figure is unknown or not modelled; read operations.components.amortized_one_time_per_year for the nullable value" }
        feasibility: { type: string, enum: [feasible, infeasible, unknown], description: "Operations mode; mirrors operations.feasibility; omitted when not assessed" }
        operations: { $ref: "#/components/schemas/PlanOperations" }
        origin_differs_from_current: { type: boolean, description: "predicted origin differs from the current origin; for a product scenario that moves nothing, savings stay 0 and duty stays at the current origin's rate" }
    DraftRow:
      type: object
      properties:
        name: { type: string }
        made_in: { type: string }
        plant: { type: string }
        group: { type: string, description: "template group id, or omitted" }
        source_paragraph: { type: integer, description: "1-based paragraph of the facts; 0 if the model cited none, and always 0 for a draft read from media" }
        source_file: { type: integer, description: "media drafts only: 1-based position of the uploaded file the row was read from; omitted if the model cited a file that was not sent" }
        source_page: { type: integer, description: "media drafts only: 1-based page within that file (1 for an image); omitted if the page cited does not exist" }
        unclear: { type: boolean, description: "media drafts only: true when the model was not sure it read the name or country correctly; check it against the document" }
        group_guessed: { type: boolean, description: "no valid group from the text; pick one" }
    MediaFile:
      type: object
      description: What was checked about one uploaded file. Never its content or file name.
      properties:
        mime_type: { type: string, enum: [image/png, image/jpeg, image/webp, application/pdf], description: "sniffed from the bytes, not the declared type" }
        bytes: { type: integer }
        width: { type: integer, description: "images only, pixels" }
        height: { type: integer, description: "images only, pixels" }
        pages: { type: integer, description: "PDFs only" }
    TargetSummary:
      type: object
      properties:
        rank: { type: integer }
        target: { type: string }
        status: { type: string, enum: [plan, below_bar, no_plan, no_plant] }
        best: { description: "best shown plan, or the closest below-bar plan; null otherwise. Carries rule_check (the 19 CFR 102.20 check of its move, D441) when the case does. On a Part 102 case the best plan is the first in the D500 order, and countries with a shown plan rank by its tier, then its rule_check (shifts first)", allOf: [{ $ref: "#/components/schemas/Plan" }] }
        shown_count: { type: integer }
        moves_searched: { type: integer, description: "Includes the move followed from advice, if any" }
        advice_followed: { type: integer, description: "Moves added by following near-miss advice (0 or 1, D85); omitted when 0" }
    MoveRef:
      type: object
      required: [key, description, move]
      properties:
        key: { type: string, example: motor_fan_assembly@th+pcba@th }
        description: { type: string }
        move: { type: object, description: "same shape as Plan.move" }
    PrecedentRef:
      type: object
      required: [id, date, subject, origin, url]
      properties:
        id: { type: string }
        date: { type: string, format: date, description: "empty if the ruling is not in the precedent pool" }
        subject: { type: string }
        origin: { type: [string, "null"], description: "CBP's held origin; null when no single held origin" }
        url: { type: string }
    EvalSummary:
      type: object
      description: Every number with its split, n, CI and source; proxy runs are flagged.
      properties:
        generated_at: { type: string }
        status: { type: string, description: e.g. "proxy, development only" until the Vertex re-run }
        items:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: number }
              ci_low: { type: number }
              ci_high: { type: number }
              n: { type: integer }
              split: { type: string }
              development_only: { type: boolean }
              source: { type: string }
        verifier_calibration: { $ref: "#/components/schemas/VerifierCalibration" }
    VerifierCalibration:
      type: object
      description: |
        How often the precedent check (verifier-v2) was right at each confidence, from the scored flip pairs (D86).
        Pooled counts add every run of the same pairs, so their n is inflated; `pair_level` counts each pair once.
      required: [bar, prompt, note, splits]
      properties:
        bar: { type: number, description: "The plan bar (0.92): a plan is shown when its check is at or above it." }
        prompt: { type: string, example: verifier-v2 }
        note: { type: string, description: "How the runs were made: LiteLLM proxy, same gemini-4-argon model as Vertex AI (D74); heat-gun pair excluded." }
        splits:
          type: array
          description: "dev first, then final."
          items: { $ref: "#/components/schemas/VerifierSplit" }
    VerifierSplit:
      type: object
      required: [split, label, development_only, runs, pairs, rows, errors, bands, shown, pair_level]
      properties:
        split: { type: string, enum: [dev, final] }
        label: { type: string }
        development_only: { type: boolean }
        caveat: { type: string, description: "On final: the 2026 pairs are not a clean held-out test (D74, D82). Show it with the numbers." }
        runs:
          type: array
          items:
            type: object
            properties:
              source: { type: string }
              mode: { type: string, enum: [known-a, unknown-a], description: "known-a: CBP's origin for the current setup was given to the check." }
              variant: { type: string, description: "base, run2, seed-run1, seed-vote3-run1, panel-run1, …" }
              rows: { type: integer }
              errors: { type: integer }
        pairs: { type: integer, description: Distinct flip pairs. }
        rows: { type: integer, description: "Scored verdicts pooled over every run (a pair counts once per run)." }
        errors: { type: integer, description: Rows with no verdict (provider failures); left out of every count. }
        bands:
          type: array
          description: "Precedent-supported verdicts by confidence, pooled over runs: ≥ 0.95, 0.92–0.95, 0.85–0.92, < 0.85. `correct` is how many were real origin changes."
          items:
            type: object
            properties:
              label: { type: string }
              min: { type: number }
              max: { type: number }
              correct: { $ref: "#/components/schemas/Rate" }
        shown:
          type: object
          description: "What the 0.92 bar would show, pooled over runs."
          properties:
            real: { type: integer }
            wrong: { type: integer }
            precision: { $ref: "#/components/schemas/Rate" }
            recall: { $ref: "#/components/schemas/Rate" }
        pair_level:
          type: object
          description: "Each pair once. A real-change pair is shown-correct only if every run showed it; a no-change pair is wrong if any run showed it."
          properties:
            pairs: { type: integer }
            real_change_pairs: { type: integer }
            shown_every_run: { type: integer }
            shown_some_runs: { type: integer }
            wrong_any_run: { type: integer }
            precision: { $ref: "#/components/schemas/Rate" }
            recall: { $ref: "#/components/schemas/Rate" }
    Rate:
      type: object
      description: k of n with a Wilson 95% interval.
      properties:
        k: { type: integer }
        n: { type: integer }
        value: { type: number }
        ci_low: { type: number }
        ci_high: { type: number }
