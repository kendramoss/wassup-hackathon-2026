<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d" font-family="'Paper Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
<title id="t">Calibration layer on the held-out split</title>
<desc id="d">Observed accuracy against stated confidence before calibration and against calibrated probability after, on the 377 held-out rulings. The map was fitted on the development set.</desc>
<rect width="760" height="470" fill="#f9fbfe"/>
<text x="64.0" y="26.0" font-size="15" fill="#13213a" text-anchor="start" font-weight="600">Held-out calibration (377 rulings), before and after the layer</text>
<text x="64.0" y="46.0" font-size="11" fill="#47566f" text-anchor="start" font-weight="400">Calibration map fitted on the development set only (isotonic, one step per emitted confidence).</text>
<text x="64.0" y="62.0" font-size="11" fill="#47566f" text-anchor="start" font-weight="400">Before: ECE 0.059, Brier 0.081. After: ECE 0.030, Brier 0.072.</text>
<line x1="64" x2="736" y1="406.0" y2="406.0" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="410.0" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">0%</text>
<line x1="64" x2="736" y1="345.6" y2="345.6" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="349.6" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">20%</text>
<line x1="64" x2="736" y1="285.2" y2="285.2" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="289.2" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">40%</text>
<line x1="64" x2="736" y1="224.8" y2="224.8" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="228.8" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">60%</text>
<line x1="64" x2="736" y1="164.4" y2="164.4" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="168.4" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">80%</text>
<line x1="64" x2="736" y1="104.0" y2="104.0" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="108.0" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">100%</text>
<text x="138.7" y="424.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">0.6</text>
<text x="288.0" y="424.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">0.7</text>
<text x="437.3" y="424.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">0.8</text>
<text x="586.7" y="424.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">0.9</text>
<text x="736.0" y="424.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">1.0</text>
<text x="400.0" y="452.0" font-size="12" fill="#47566f" text-anchor="middle" font-weight="400">Stated confidence, or calibrated probability</text>
<circle cx="72" cy="80" r="5" fill="#f9fbfe" stroke="#8fa7d6" stroke-width="2"/>
<text x="84.0" y="84.0" font-size="11" fill="#13213a" text-anchor="start" font-weight="400">before: stated confidence (engine-v1)</text>
<circle cx="394" cy="80" r="5" fill="#1d4fc4" stroke="#f9fbfe" stroke-width="2"/>
<text x="406.0" y="84.0" font-size="11" fill="#13213a" text-anchor="start" font-weight="400">after: calibrated probability</text>
<text x="736.0" y="398.0" font-size="10" fill="#6e7c94" text-anchor="end" font-weight="400">points with n &lt; 5 are drawn smaller</text>
<line x1="64.0" y1="239.9" x2="736.0" y2="104.0" stroke="#6e7c94" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="168.5" y="208.8" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">stated = observed</text>
