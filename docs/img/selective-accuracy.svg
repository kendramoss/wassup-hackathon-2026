<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="t d" font-family="'Paper Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
<title id="t">Selective accuracy: held-out and development</title>
<desc id="d">Accuracy of accepted cases against coverage as the confidence bar moves. At the 0.92 bar the held-out split accepts 81.2% of cases at 96.1%.</desc>
<rect width="760" height="500" fill="#f9fbfe"/>
<text x="64.0" y="26.0" font-size="15" fill="#13213a" text-anchor="start" font-weight="600">Accuracy of accepted cases as the confidence bar moves</text>
<text x="64.0" y="46.0" font-size="11" fill="#47566f" text-anchor="start" font-weight="400">Accept a case when its stated confidence is at least t, for each t the model emitted.</text>
<line x1="64" x2="90" y1="70" y2="70" stroke="#1d4fc4" stroke-width="2"/>
<text x="98.0" y="74.0" font-size="11" fill="#13213a" text-anchor="start" font-weight="400">Held-out 2026, n = 377; shaded: 95% Wilson interval</text>
<line x1="64" x2="90" y1="88" y2="88" stroke="#8fa7d6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="98.0" y="92.0" font-size="11" fill="#13213a" text-anchor="start" font-weight="400">Development set Jul–Dec 2025, n = 463 after scoring adjustments; the bar was chosen here</text>
