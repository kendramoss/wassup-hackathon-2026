<text x="467.2" y="454.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">60%</text>
<text x="601.6" y="454.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">80%</text>
