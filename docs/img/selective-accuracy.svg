<text x="56.0" y="329.3" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">70%</text>
<line x1="64" x2="736" y1="251.6" y2="251.6" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="255.6" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">80%</text>
<line x1="64" x2="736" y1="177.8" y2="177.8" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="181.8" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">90%</text>
<line x1="64" x2="736" y1="104.0" y2="104.0" stroke="#d3dff0" stroke-width="1"/>
<text x="56.0" y="108.0" font-size="11" fill="#6e7c94" text-anchor="end" font-weight="400">100%</text>
<text x="64.0" y="454.0" font-size="11" fill="#6e7c94" text-anchor="middle" font-weight="400">0%</text>
