<text x="64.0" y="46.0" font-size="11" fill="#47566f" text-anchor="start" font-weight="400">One point per confidence value the model emitted, n = 377. Bars: 95% Wilson interval.</text>
<text x="64.0" y="62.0" font-size="11" fill="#47566f" text-anchor="start" font-weight="400">Mean stated confidence 94.7%, accuracy 90.2%. ECE 0.059, Brier 0.081.</text>
