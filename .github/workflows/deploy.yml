# legacy name kept: Secret Manager secret origin-proof-admin-token keeps its name (renaming needs a migration, D-rename).
# On every push to main: run CI, deploy whichever service changed to Cloud Run,
# then smoke-test the live site. Auth is keyless (Workload Identity Federation);
# one-time GCP setup is scripts/setup-github-deploy.sh.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual run deploys both services

# Never run two deploys at once; queue them instead of cancelling.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  PROJECT: wassup-hackathon-2026
  REGION: us-central1
  WIF_PROVIDER: projects/88903435351/locations/global/workloadIdentityPools/github/providers/github-actions
  DEPLOYER: github-deployer@wassup-hackathon-2026.iam.gserviceaccount.com
  BACKEND_URL: https://backend-88903435351.us-central1.run.app
  FRONTEND_URL: https://frontend-88903435351.us-central1.run.app
  # The public domain (Cloud Run domain mapping); the run.app URL above stays valid.
  PUBLIC_URL: https://undelabs.dev

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # Deploy flags mirror the README, minus --allow-unauthenticated /
  # --no-allow-unauthenticated: the deployer can't change IAM, and leaving the
  # flag out keeps each service's existing access.
  backend:
    needs: [ci, changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: >-
          gcloud run deploy backend --source backend
          --project "$PROJECT" --region "$REGION" --quiet
          --service-account "agent-backend@$PROJECT.iam.gserviceaccount.com"
          --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT,GOOGLE_CLOUD_LOCATION=global,LLM_PROVIDER=vertex,CASES_STORE=firestore,VERIFIER_CACHE_STORE=firestore,TEXTILE_ENGINE=on,TEXTILE_FAST_PATH=0.95,TEXTILE_PROMPT=v2,DAILY_SPEND_CAP_USD=25,CASE_OWNERSHIP=on,PHARMA_ENGINE=on,PHARMA_FAST_PATH=0.85,USMCA_ENGINE=on,USMCA_FAST_PATH=0.95,FALLBACK_ENGINE_MODEL=gemini-3.8-flash,CASE_AGENT_MODEL=gemini-3.8-flash,FALLBACK_ENGINE_LOCATION=global,ENGINE_ATTEMPTS=1,LLM_CALL_GAP=8s,LLM_COOL_DOWN=60s,LLM_MAX_IN_FLIGHT=4,VERIFIER_PANEL=on,NEAR_MISS_ADVICE=on,FOLLOW_ADVICE=on,DUTY_LIVE_MFN=on,STREAM_PREDICT=on,HTS_SUGGEST=on,EXPORT_CFR177=on,BOM_VERSIONS=on,TEAMS=on,TEAMS_AUDIENCE=88903435351-i8mugbokimlne3ns8rlsql93qrc7mths.apps.googleusercontent.com"
          --set-secrets "ADMIN_TOKEN=origin-proof-admin-token:latest"
          --timeout=900
          --min-instances 1
          --max-instances 3
      # A --no-traffic preview deploy pins traffic to one revision; make sure
      # this deploy goes live anyway.
      - run: gcloud run services update-traffic backend --project "$PROJECT" --region "$REGION" --to-latest --quiet

  frontend:
    needs: [ci, changes, backend]
    # Run even when the backend deploy was skipped, but not when it failed.
    if: >-
      always() && needs.ci.result == 'success'
      && needs.changes.outputs.frontend == 'true'
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: >-
          gcloud run deploy frontend --source frontend
          --project "$PROJECT" --region "$REGION" --quiet
          --service-account "frontend@$PROJECT.iam.gserviceaccount.com"
          --set-env-vars "BACKEND_URL=$BACKEND_URL,GOOGLE_CLIENT_ID=88903435351-i8mugbokimlne3ns8rlsql93qrc7mths.apps.googleusercontent.com"
          --max-instances 3
      # A --no-traffic preview deploy pins traffic to one revision; make sure
      # this deploy goes live anyway.
      - run: gcloud run services update-traffic frontend --project "$PROJECT" --region "$REGION" --to-latest --quiet

  # The backend is private (only frontend@ may call it), so check that its new
  # revision started and is serving: config validation runs at startup and a
  # bad config (e.g. LLM_PROVIDER=fake on Cloud Run) fails the revision.
  # Then check the public frontend answers. Replace with an end-to-end
  # /v1/cases/predict call once the frontend proxies it (Gate D).
  smoke-test:
    needs: [backend, frontend]
    # Only after something was deployed, and nothing failed. Names each job:
    # contains(needs.*.result, 'success') was true with both jobs skipped.
    if: >-
      always()
      && (needs.backend.result == 'success' || needs.frontend.result == 'success')
      && needs.backend.result != 'failure' && needs.frontend.result != 'failure'
      && needs.backend.result != 'cancelled' && needs.frontend.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Backend revision is ready and serving all traffic
        run: |
          ready=$(gcloud run services describe backend --project "$PROJECT" --region "$REGION" \
            --format='value(status.conditions[0].status)')
          latest=$(gcloud run services describe backend --project "$PROJECT" --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')
          serving=$(gcloud run services describe backend --project "$PROJECT" --region "$REGION" \
            --format='value(status.traffic[0].revisionName)')
          echo "ready=$ready latest=$latest serving=$serving"
          [ "$ready" = "True" ] && [ "$latest" = "$serving" ] || { echo "::error::backend not ready on its latest revision"; exit 1; }
      - name: Frontend answers
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$FRONTEND_URL/")
          echo "frontend / -> $code"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }
